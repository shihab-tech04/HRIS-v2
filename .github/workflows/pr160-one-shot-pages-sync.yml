name: PR160 one-shot protected-check Pages bundle synchronization
on:
  push:
    branches:
      - integration/ws05-hr03-current-main-20261031
    paths:
      - .github/workflows/pr160-one-shot-pages-sync.yml
permissions:
  contents: write
jobs:
  synchronize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/ws05-hr03-current-main-20261031
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Build exact required-check Pages bundle
        env:
          VITE_ENABLE_PLATFORM_TENANTS: 'true'
        run: |
          set -euo pipefail
          npm install --include=optional --no-audit --no-fund
          npm run lint
          npm run build
          cmp dist/index.html index.html
          diff -qr dist/assets assets
          git diff --check
      - name: Commit generated files to PR160 only
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/integration/ws05-hr03-current-main-20261031"
          git add -A -- index.html assets .nojekyll
          if git diff --cached --quiet; then
            echo "Already synchronized"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(hr03): match protected check exact Pages bundle configuration'
          git push origin HEAD:refs/heads/integration/ws05-hr03-current-main-20261031
