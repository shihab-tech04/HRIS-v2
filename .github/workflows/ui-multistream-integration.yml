name: HRIS UI multistream integration rehearsal (no deploy)
on:
  push:
    branches: [work/hris-ui-multistream-integration-20261021]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hris-ui-integration-${{ github.ref }}
  cancel-in-progress: false
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: '1'
    steps:
      - name: Checkout exact WS08-derived integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin and inspect upstream workstation sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p integration-evidence
          git fetch origin "+refs/heads/work/ws07-hr-org-phase05-20261020:refs/remotes/origin/work/ws07-hr-org-phase05-20261020" "+refs/heads/work/ws06-employee-profile-figma-20261021:refs/remotes/origin/work/ws06-employee-profile-figma-20261021"
          git merge-base --is-ancestor "bafda05579a3144f455620e635bec6e093b160c1" HEAD
          test "$(git merge-base HEAD bafda05579a3144f455620e635bec6e093b160c1)" = "bafda05579a3144f455620e635bec6e093b160c1"
          git cat-file -e "9d7cf862e060babc259d94bbbbf5daa13536b015^{commit}"
          git cat-file -e "3f1f1f1b0edb6341cf6e4be8501eff88789caf44^{commit}"
          printf 'WS08 base: %s\nWS07: %s\nWS06: %s\n' "bafda05579a3144f455620e635bec6e093b160c1" "9d7cf862e060babc259d94bbbbf5daa13536b015" "3f1f1f1b0edb6341cf6e4be8501eff88789caf44" > integration-evidence/pinned-heads.txt
      - name: Rehearse real cross-workstation Git merges
        shell: bash
        run: |
          set -euo pipefail
          if ! git -c user.name='HRIS Integration CI' -c user.email='ci@example.invalid' merge --no-commit --no-ff 9d7cf862e060babc259d94bbbbf5daa13536b015 > integration-evidence/ws07-merge.log 2>&1; then
            git diff --name-only --diff-filter=U > integration-evidence/ws07-conflicts.txt
            git diff > integration-evidence/ws07-conflict-diff.txt || true
            cp src/live/LiveHrisWorkspace.tsx integration-evidence/LiveHrisWorkspace.unmerged.txt
            cp tests/browser/attendance-information.spec.ts integration-evidence/attendance-information.unmerged.txt
            cp tests/contracts/attendance-report.test.mjs integration-evidence/attendance-report.unmerged.txt
            cat integration-evidence/ws07-conflicts.txt
            python3 scripts/integration/resolve-ws07-conflicts.py
            git add src/live/LiveHrisWorkspace.tsx src/live/LiveApp.tsx tests/browser/hr-operations-leave-request-states.spec.ts tests/browser/manager-leave.spec.ts tests/browser/attendance-information.spec.ts tests/browser/ws07-attendance-information.spec.ts tests/contracts/attendance-report.test.mjs tests/contracts/ws07-attendance-report.test.mjs tests/contracts/live-workspace.test.mjs
            git diff --cached --check -- src/live/LiveHrisWorkspace.tsx src/live/LiveApp.tsx tests/browser/hr-operations-leave-request-states.spec.ts tests/browser/manager-leave.spec.ts tests/browser/attendance-information.spec.ts tests/browser/ws07-attendance-information.spec.ts tests/contracts/attendance-report.test.mjs tests/contracts/ws07-attendance-report.test.mjs tests/contracts/live-workspace.test.mjs
          fi
          git -c user.name='HRIS Integration CI' -c user.email='ci@example.invalid' commit -m 'Disposable WS07 resolved integration' > integration-evidence/ws07-commit.log 2>&1
          if ! git -c user.name='HRIS Integration CI' -c user.email='ci@example.invalid' merge --no-commit --no-ff 3f1f1f1b0edb6341cf6e4be8501eff88789caf44 > integration-evidence/ws06-merge.log 2>&1; then
            git diff --name-only --diff-filter=U > integration-evidence/ws06-conflicts.txt
            git diff > integration-evidence/ws06-conflict-diff.txt || true
            echo "WS06 integration needs source-aware conflict resolution."
            exit 1
          fi
          git -c user.name='HRIS Integration CI' -c user.email='ci@example.invalid' commit -m 'Disposable WS06 integration' > integration-evidence/ws06-commit.log 2>&1
          python3 scripts/integration/dedupe-bengali-merge.py
          if ! git diff --quiet -- src/live/project-locale.ts; then
            git add src/live/project-locale.ts
            git -c user.name='HRIS Integration CI' -c user.email='ci@example.invalid' commit -m 'Preserve identical EN/BN locale mappings after merge'
          fi
          git log --oneline -8 > integration-evidence/merged-graph.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Build and cross-repository contract checks
        run: |
          git clone --depth 1 --branch development/hris-checkpoints https://github.com/shihab-tech04/HRIS-Candidate-v2.git "$GITHUB_WORKSPACE/../HRIS-Candidate-v2"
          npm install --include=optional --no-audit --no-fund
          npm run lint
          npm run test:contracts
          npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Focused cross-role browser regressions
        run: npx playwright test tests/browser/attendance-information.spec.ts tests/browser/ws07-attendance-information.spec.ts tests/browser/hr-operations-leave-request-states.spec.ts tests/browser/manager-leave.spec.ts --retries=0
      - name: Full integrated browser acceptance
        run: npm run test:e2e
      - name: Export exact merged source delta for connector-controlled integration branch
        if: success()
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess, base64, hashlib
          from pathlib import Path
          before = __import__('os').environ['GITHUB_SHA']
          paths = subprocess.check_output(['git','diff','--name-only','-z',before,'HEAD']).decode().split('\0')
          allowed = ('src/', 'tests/', 'scripts/', 'docs/', '.github/', 'supabase/')
          print(f'HRIS_EXPORT_BEGIN|{before}|{subprocess.check_output(["git","rev-parse","HEAD"]).decode().strip()}', flush=True)
          total = 0
          for path in sorted(filter(None, paths)):
              if not path.startswith(allowed): continue
              p=Path(path)
              if not p.is_file():
                  print('HRIS_EXPORT_DELETE|'+path,flush=True);continue
              data=p.read_bytes()
              if len(data)>2_000_000: raise RuntimeError(f'Oversize tracked file {path}')
              total += len(data)
              if total>9_000_000: raise RuntimeError('Export exceeds safe source limit')
              b64=base64.b64encode(data).decode()
              chunks=[b64[i:i+6400] for i in range(0,len(b64),6400)]
              digest=hashlib.sha256(data).hexdigest()
              print(f'HRIS_EXPORT_FILE|{path}|{len(data)}|{digest}|{len(chunks)}',flush=True)
              for i,chunk in enumerate(chunks):
                  print(f'HRIS_EXPORT_CHUNK|{path}|{i}|{chunk}',flush=True)
          print(f'HRIS_EXPORT_END|{total}',flush=True)
          PY
      - name: Preserve conflict and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hris-multistream-merge-diagnostics
          path: |
            integration-evidence/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
