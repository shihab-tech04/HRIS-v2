name: HRIS temporary branch-only compiled Pages synchronization
on:
  push:
    branches:
      - fix/hris-platform-tenant-bengali-parity-20261104
permissions:
  contents: write
jobs:
  synchronize-assets:
    if: github.repository == 'shihab-tech04/HRIS-v2' && github.ref == 'refs/heads/fix/hris-platform-tenant-bengali-parity-20261104'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true
      - name: Lock source parent commit before syncing build assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'c884072205dae3d30999f157d845653b2a9534cb'
          test "$GITHUB_REF" = 'refs/heads/fix/hris-platform-tenant-bengali-parity-20261104'
          test -s tests/contracts/platform-tenant-locale-reconciliation.test.mjs
          test -s src/live/project-locale.ts
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Deterministic production dependency install
        run: npm ci --include=optional --no-audit --no-fund
      - name: Verify Bengali parity contract
        run: node --test tests/contracts/platform-tenant-locale-reconciliation.test.mjs
      - name: Compile exact production Pages assets
        env:
          GITHUB_PAGES: 'true'
          VITE_ENABLE_PLATFORM_TENANTS: 'true'
        run: npm run build
      - name: Commit generated assets on this unprotected source branch only
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s dist/index.html
          test -s tests/contracts/platform-tenant-locale-reconciliation.test.mjs
          git add index.html assets .nojekyll
          if git diff --cached --quiet; then
            echo '::error::No compiled asset update despite translated source change'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: synchronize reviewed Platform Tenant Bengali Pages assets'
          git push origin HEAD:refs/heads/fix/hris-platform-tenant-bengali-parity-20261104
          echo 'PASS: compiled assets committed only to review branch; no deployment'
