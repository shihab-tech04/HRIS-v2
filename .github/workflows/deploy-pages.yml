name: Publish HRIS on GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: 'true'
      VITE_ENABLE_PLATFORM_TENANTS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript and static contract checks
        run: npm run lint && npm run test:contracts
      - name: Build GitHub Pages application
        run: npm run build
      - name: Verify the built Pages entry and platform controls
        run: |
          set -euo pipefail
          grep -Fq 'src="/HRIS-v2/assets/' dist/index.html
          grep -Fq 'href="/HRIS-v2/assets/' dist/index.html
          find dist/assets -maxdepth 1 -type f -name '*.js' -print -quit | grep -q .
          find dist/assets -maxdepth 1 -type f -name '*.css' -print -quit | grep -q .
          grep -R -Fq 'platform_hris_list_tenant_modules' dist/assets
          grep -R -Fq 'Optional modules' dist/assets
          echo 'PASS: production bundle includes tenant module controls and the Pages asset base.'
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke gate
        run: npm run test:e2e
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify published HRIS compiled assets
        run: |
          set -euo pipefail
          base="https://shihab-tech04.github.io"
          for attempt in $(seq 1 20); do
            curl -fsSL -H 'Cache-Control: no-cache' "$base/HRIS-v2/?release=$GITHUB_SHA&attempt=$attempt" -o /tmp/hris-live.html || true
            if grep -Eq 'src="/HRIS-v2/assets/[^"]+\.js"' /tmp/hris-live.html &&
               grep -Eq 'href="/HRIS-v2/assets/[^"]+\.css"' /tmp/hris-live.html; then
              break
            fi
            sleep 3
          done
          grep -Eq 'src="/HRIS-v2/assets/[^"]+\.js"' /tmp/hris-live.html
          grep -Eq 'href="/HRIS-v2/assets/[^"]+\.css"' /tmp/hris-live.html
          js="$(grep -oE 'src="/HRIS-v2/assets/[^"]+\.js"' /tmp/hris-live.html | head -1 | cut -d '"' -f2)"
          css="$(grep -oE 'href="/HRIS-v2/assets/[^"]+\.css"' /tmp/hris-live.html | head -1 | cut -d '"' -f2)"
          curl -fsSL "$base$js" -o /tmp/hris-live.js
          curl -fsSL "$base$css" -o /tmp/hris-live.css
          test -s /tmp/hris-live.js
          test -s /tmp/hris-live.css
          grep -Fq 'Forgot password?' /tmp/hris-live.js
          grep -Fq 'platform_hris_list_tenant_modules' /tmp/hris-live.js
          grep -Fq 'Optional modules' /tmp/hris-live.js
          echo "PASS: live HRIS serves compiled JS/CSS, recovery, and tenant module controls"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install live browser verification dependencies
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Verify published login and recovery screen with Chromium
        run: |
          node --input-type=module <<'NODE'
          import { chromium, expect } from '@playwright/test';
          const browser = await chromium.launch();
          try {
            const page = await browser.newPage();
            const errors = [];
            page.on('pageerror', error => errors.push(error.message));
            const response = await page.goto('https://shihab-tech04.github.io/HRIS-v2/', {
              waitUntil: 'domcontentloaded',
              timeout: 30000,
            });
            if (!response?.ok()) throw Error('Published HRIS returned HTTP ' + response?.status());
            await expect(page.getByRole('heading', { name: 'Sign in to your workspace' })).toBeVisible({ timeout: 15000 });
            await page.getByRole('button', { name: 'Forgot password?' }).click();
            await expect(page.getByRole('heading', { name: 'Reset your password' })).toBeVisible();
            await expect(page.getByLabel('Account email')).toBeVisible();
            await page.getByRole('button', { name: 'Back to sign in' }).click();
            await expect(page.getByRole('heading', { name: 'Sign in to your workspace' })).toBeVisible();
            if (errors.length) throw Error('Production React exceptions: ' + errors.join('; '));
            console.log('PASS: published HRIS login and recovery UI rendered in real Chromium');
          } finally {
            await browser.close();
          }
          NODE

      - name: Verify published tenant module controls with a synthetic session
        run: |
          node --input-type=module <<'NODE'
          import { chromium, expect } from '@playwright/test';
          const userId = 'e1111111-1111-4111-8111-111111111111';
          const tenantId = 'e2222222-2222-4222-8222-222222222222';
          const user = { id: userId, aud: 'authenticated', role: 'authenticated',
            email: 'synthetic-superadmin@example.org', app_metadata: { provider: 'email', providers: ['email'] },
            user_metadata: {}, created_at: '2026-01-01T00:00:00.000Z' };
          const jwtHeader = Buffer.from(JSON.stringify({ typ: 'JWT', alg: 'HS256' })).toString('base64url');
          const jwtPayload = Buffer.from(JSON.stringify({ sub: userId, aud: 'authenticated',
            role: 'authenticated', email: user.email, iss: 'https://oslgwxaqfbteqtwqvdzs.supabase.co/auth/v1',
            exp: Math.floor(Date.now() / 1000) + 3600 })).toString('base64url');
          const jwt = [jwtHeader, jwtPayload, 'synthetic-signature'].join('.');
          const browser = await chromium.launch();
          try {
            const page = await browser.newPage();
            const errors = [];
            page.on('pageerror', error => errors.push(error.message));
            const cors = {
              'access-control-allow-origin': '*',
              'access-control-allow-headers': 'authorization, apikey, content-type, x-client-info',
              'access-control-allow-methods': 'GET,POST,OPTIONS',
            };
            await page.route('**/auth/v1/**', async route => {
              const request = route.request();
              if (request.method() === 'OPTIONS') return route.fulfill({ status: 204, headers: cors });
              const path = new URL(request.url()).pathname;
              const body = path.endsWith('/token')
                ? { access_token: jwt, refresh_token: 'synthetic-refresh', token_type: 'bearer', expires_in: 3600, user }
                : user;
              await route.fulfill({ status: 200, headers: { ...cors, 'content-type': 'application/json' }, body: JSON.stringify(body) });
            });
            await page.route('**/rest/v1/**', async route => {
              const request = route.request();
              const url = new URL(request.url());
              if (request.method() === 'OPTIONS') return route.fulfill({ status: 204, headers: cors });
              const rpc = url.pathname.match(/\/rpc\/([^/]+)$/)?.[1] || '';
              const table = url.pathname.split('/').pop();
              const select = url.searchParams.get('select') || '';
              let data = [];
              if (rpc === 'platform_hris_is_super_admin') data = true;
              else if (rpc === 'platform_hris_list_tenants') data = [{
                id: tenantId, code: 'SYN-01', slug: 'synesis-it', name: 'Synthetic Synesis',
                is_active: true, timezone: 'Asia/Dhaka', default_locale: 'en', active_admin_count: 1,
              }];
              else if (rpc === 'platform_hris_list_tenant_modules') data = [
                { module_key: 'travel', enabled: true, updated_at: null },
                { module_key: 'expenses', enabled: true, updated_at: null },
                { module_key: 'learning', enabled: true, updated_at: null },
              ];
              else if (rpc === 'platform_hris_set_tenant_module' || rpc === 'platform_hris_set_tenant_admin'
                || rpc === 'platform_hris_set_tenant_admin_by_email') throw Error('Unexpected write RPC in synthetic live smoke.');
              else if (rpc === 'has_permission') data = true;
              else if (table === 'tenant_memberships') data = [{ tenant_id: tenantId, role: 'hr_admin', status: 'active' }];
              else if (table === 'employees') data = [];
              else if (table === 'admin_users') data = { active: true, is_super_admin: true };
              else if (table === 'tenants') data = select === 'id'
                ? { id: tenantId }
                : [{ id: tenantId, name: 'Synthetic Synesis', slug: 'synesis-it', timezone: 'Asia/Dhaka' }];
              if (request.method() === 'HEAD') {
                return route.fulfill({ status: 200, headers: { ...cors, 'content-range': '0-0/1' }, body: '' });
              }
              await route.fulfill({ status: 200, headers: { ...cors, 'content-type': 'application/json' }, body: JSON.stringify(data) });
            });
            const response = await page.goto('https://shihab-tech04.github.io/HRIS-v2/', { waitUntil: 'domcontentloaded', timeout: 30000 });
            if (!response?.ok()) throw Error('Published HRIS returned HTTP ' + response?.status());
            await page.getByLabel('Email', { exact: true }).fill(user.email);
            await page.getByLabel('Password', { exact: true }).fill('synthetic-password-only');
            await page.getByRole('button', { name: 'Sign in', exact: true }).click();
            await page.getByRole('button', { name: 'Platform tenants', exact: true }).click();
            await expect(page.getByRole('heading', { name: 'Platform tenants', exact: true })).toBeVisible();
            await page.getByRole('button', { name: 'Optional modules', exact: true }).click();
            await expect(page.getByText('Travel requests', { exact: true })).toBeVisible();
            await expect(page.getByText('Expense claims', { exact: true })).toBeVisible();
            await expect(page.getByText('Learning', { exact: true })).toBeVisible();
            if (errors.length) throw Error('Published HRIS React exceptions: ' + errors.join('; '));
            console.log('PASS: published Pages app rendered tenant module controls with a synthetic Super Admin session; no production writes were made.');
          } finally {
            await browser.close();
          }
          NODE
