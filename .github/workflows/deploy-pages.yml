name: Publish HRIS on GitHub Pages
on:
  workflow_dispatch:
    inputs:
      release_approved:
        description: Confirm that the owner has explicitly approved this production release.
        required: true
        type: boolean
        default: false
      session_pooler_host:
        description: "HRIS Supabase session-pooler HOST only, matching the approved SQL workflow"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    if: github.ref == 'refs/heads/main' && inputs.release_approved == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail closed if hosted Employee Profile SQL and access guards are missing
        shell: bash
        env:
          PGHOST: ${{ inputs.session_pooler_host }}
          PGPORT: '5432'
          PGDATABASE: postgres
          PGUSER: postgres.xfuxnljfrgvusbrpvxpa
          PGSSLMODE: require
          PGPASSWORD: ${{ secrets.HRIS_DB_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${PGPASSWORD:-}" || { echo '::error::HRIS_DB_PASSWORD missing; Pages not deployed'; exit 1; }
          [[ "$PGHOST" =~ ^aws-[0-9]+-ap-northeast-2\.pooler\.supabase\.com$ ]] || {
            echo '::error::Invalid HRIS session pooler host; Pages not deployed'; exit 1;
          }
          db_psql() {
            docker run --rm --env PGHOST --env PGPORT --env PGDATABASE \
              --env PGUSER --env PGSSLMODE --env PGPASSWORD \
              postgres:17-alpine psql -X -A -t -v ON_ERROR_STOP=1 "$@"
          }
          result="$(db_psql -c "
            SELECT CASE WHEN
              (SELECT COUNT(*) FROM supabase_migrations.schema_migrations
               WHERE version IN ('20261027040642','20261030114500')) = 2
              AND to_regprocedure('public.employee_get_my_profile_v1(uuid)') IS NOT NULL
              AND (SELECT COUNT(*) FROM supabase_migrations.schema_migrations
                   WHERE version='20261109130637') = 1
              AND to_regprocedure('public.employee_get_my_avatar_v1(uuid)') IS NOT NULL
              AND to_regprocedure('public.employee_set_my_avatar_v1(uuid,text,text)') IS NOT NULL
              AND NOT has_function_privilege('anon','public.employee_get_my_avatar_v1(uuid)','EXECUTE')
              AND NOT has_function_privilege('anon','public.employee_set_my_avatar_v1(uuid,text,text)','EXECUTE')
              AND has_function_privilege('authenticated','public.employee_get_my_avatar_v1(uuid)','EXECUTE')
              AND has_function_privilege('authenticated','public.employee_set_my_avatar_v1(uuid,text,text)','EXECUTE')
              AND (SELECT COUNT(*) FROM supabase_migrations.schema_migrations
                   WHERE version='20261110120000') = 1
              AND to_regprocedure('public.hris_submit_my_work_from_home_request(uuid,date,date,time,time,jsonb,text,text)') IS NOT NULL
              AND to_regprocedure('public.hris_update_my_work_from_home_request(uuid,uuid,date,date,time,time,jsonb,text,text)') IS NOT NULL
              AND to_regprocedure('public.hris_cancel_my_work_from_home_request(uuid,uuid)') IS NOT NULL
              AND to_regprocedure('public.hris_resolve_tenant_work_from_home_request(uuid,uuid,text,text,text)') IS NOT NULL
              AND NOT has_function_privilege('anon','public.hris_submit_my_work_from_home_request(uuid,date,date,time,time,jsonb,text,text)','EXECUTE')
              AND NOT has_function_privilege('anon','public.hris_update_my_work_from_home_request(uuid,uuid,date,date,time,time,jsonb,text,text)','EXECUTE')
              AND NOT has_function_privilege('anon','public.hris_cancel_my_work_from_home_request(uuid,uuid)','EXECUTE')
              AND NOT has_function_privilege('anon','public.hris_resolve_tenant_work_from_home_request(uuid,uuid,text,text,text)','EXECUTE')
              AND has_function_privilege('authenticated','public.hris_submit_my_work_from_home_request(uuid,date,date,time,time,jsonb,text,text)','EXECUTE')
              AND has_function_privilege('authenticated','public.hris_update_my_work_from_home_request(uuid,uuid,date,date,time,time,jsonb,text,text)','EXECUTE')
              AND has_function_privilege('authenticated','public.hris_cancel_my_work_from_home_request(uuid,uuid)','EXECUTE')
              AND has_function_privilege('authenticated','public.hris_resolve_tenant_work_from_home_request(uuid,uuid,text,text,text)','EXECUTE')
              AND NOT has_function_privilege('service_role','public.hris_resolve_tenant_work_from_home_request(uuid,uuid,text,text,text)','EXECUTE')
              AND (SELECT COUNT(*) FROM supabase_migrations.schema_migrations
                   WHERE version='20261110193754' AND name='hris_attendance_correction_movement_parity') = 1
              AND to_regprocedure('public.hris_get_my_attendance_correction_context(uuid)') IS NOT NULL
              AND to_regprocedure('public.hris_employee_submit_attendance_correction(uuid,jsonb)') IS NOT NULL
              AND to_regprocedure('public.hris_employee_update_attendance_correction(uuid,uuid,jsonb)') IS NOT NULL
              AND to_regprocedure('public.hris_employee_cancel_attendance_correction(uuid,uuid)') IS NOT NULL
              AND to_regprocedure('public.admin_resolve_attendance_correction(uuid,text,text)') IS NOT NULL
              AND to_regprocedure('public.hris_submit_my_movement_request(uuid,jsonb)') IS NOT NULL
              AND to_regprocedure('public.hris_resolve_tenant_movement_request(uuid,uuid,text,text,text)') IS NOT NULL
              AND to_regprocedure('public.hris_mark_my_movement_returned(uuid,uuid)') IS NOT NULL
              AND NOT has_function_privilege('anon','public.hris_get_my_attendance_correction_context(uuid)','EXECUTE')
              AND NOT has_function_privilege('anon','public.hris_employee_submit_attendance_correction(uuid,jsonb)','EXECUTE')
              AND NOT has_function_privilege('anon','public.hris_employee_update_attendance_correction(uuid,uuid,jsonb)','EXECUTE')
              AND NOT has_function_privilege('anon','public.hris_employee_cancel_attendance_correction(uuid,uuid)','EXECUTE')
              AND NOT has_function_privilege('anon','public.admin_resolve_attendance_correction(uuid,text,text)','EXECUTE')
              AND NOT has_function_privilege('anon','public.hris_submit_my_movement_request(uuid,jsonb)','EXECUTE')
              AND NOT has_function_privilege('anon','public.hris_resolve_tenant_movement_request(uuid,uuid,text,text,text)','EXECUTE')
              AND NOT has_function_privilege('anon','public.hris_mark_my_movement_returned(uuid,uuid)','EXECUTE')
              AND has_function_privilege('authenticated','public.hris_get_my_attendance_correction_context(uuid)','EXECUTE')
              AND has_function_privilege('authenticated','public.hris_employee_submit_attendance_correction(uuid,jsonb)','EXECUTE')
              AND has_function_privilege('authenticated','public.hris_employee_update_attendance_correction(uuid,uuid,jsonb)','EXECUTE')
              AND has_function_privilege('authenticated','public.hris_employee_cancel_attendance_correction(uuid,uuid)','EXECUTE')
              AND has_function_privilege('authenticated','public.admin_resolve_attendance_correction(uuid,text,text)','EXECUTE')
              AND has_function_privilege('authenticated','public.hris_submit_my_movement_request(uuid,jsonb)','EXECUTE')
              AND has_function_privilege('authenticated','public.hris_resolve_tenant_movement_request(uuid,uuid,text,text,text)','EXECUTE')
              AND has_function_privilege('authenticated','public.hris_mark_my_movement_returned(uuid,uuid)','EXECUTE')
              AND NOT has_function_privilege('anon','private.hris_attendance_correction_values(uuid,uuid,jsonb,text)','EXECUTE')
              AND NOT has_function_privilege('authenticated','private.hris_attendance_correction_values(uuid,uuid,jsonb,text)','EXECUTE')
              AND NOT has_function_privilege('service_role','private.hris_attendance_correction_values(uuid,uuid,jsonb,text)','EXECUTE')
              AND COALESCE((SELECT relrowsecurity FROM pg_class
                            WHERE oid=to_regclass('public.attendance_correction_settings')),false)
              AND NOT has_table_privilege('anon','public.attendance_correction_settings','SELECT')
              AND NOT has_table_privilege('anon','public.attendance_correction_settings','INSERT')
              AND NOT has_table_privilege('anon','public.attendance_correction_settings','UPDATE')
              AND NOT has_table_privilege('anon','public.attendance_correction_settings','DELETE')
              AND NOT has_table_privilege('authenticated','public.attendance_correction_settings','SELECT')
              AND NOT has_table_privilege('authenticated','public.attendance_correction_settings','INSERT')
              AND NOT has_table_privilege('authenticated','public.attendance_correction_settings','UPDATE')
              AND NOT has_table_privilege('authenticated','public.attendance_correction_settings','DELETE')
              AND EXISTS (SELECT 1 FROM storage.buckets WHERE id='attendance-evidence' AND public=false)
              AND (SELECT COUNT(*) FROM information_schema.columns
                   WHERE table_schema='public' AND table_name='attendance_corrections'
                     AND column_name IN ('correction_categories','original_check_in','original_check_out','original_work_mode','original_client_name')) = 5
              AND EXISTS (SELECT 1 FROM pg_constraint WHERE conrelid='public.attendance_records'::regclass
                          AND conname='attendance_records_work_mode_check' AND pg_get_constraintdef(oid) LIKE '%client_meeting%')
              AND EXISTS (SELECT 1 FROM pg_constraint WHERE conrelid='public.attendance_corrections'::regclass
                          AND conname='attendance_corrections_requested_work_mode_check' AND pg_get_constraintdef(oid) LIKE '%client_meeting%')
              AND EXISTS (SELECT 1 FROM pg_constraint WHERE conrelid='public.attendance_corrections'::regclass
                          AND conname='attendance_corrections_categories_allowed')
              AND (SELECT COUNT(*) FROM pg_policies WHERE schemaname='storage' AND tablename='objects'
                   AND policyname IN ('attendance_evidence_own_select','hris_private_storage_tenant_read_guard')) = 2
              AND EXISTS (SELECT 1 FROM storage.buckets
                          WHERE id='employee-avatars' AND public=false)
              AND to_regprocedure('public.employee_delete_my_profile_record_v1(uuid,text,uuid)') IS NOT NULL
              AND to_regclass('public.employee_bank_details') IS NOT NULL
              AND COALESCE((SELECT relrowsecurity FROM pg_class
                            WHERE oid=to_regclass('public.employee_bank_details')),false)
              AND NOT has_table_privilege('anon','public.employee_bank_details','SELECT')
              AND NOT has_table_privilege('authenticated','public.employee_bank_details','SELECT')
              AND (SELECT COUNT(*) FROM pg_policies
                   WHERE schemaname='storage' AND tablename='objects'
                     AND permissive='RESTRICTIVE'
                     AND policyname IN (
                       'employee_profile_certificate_select_namespace_guard',
                       'employee_profile_certificate_insert_namespace_guard',
                       'employee_profile_certificate_update_namespace_guard',
                       'employee_profile_certificate_delete_namespace_guard')) = 4
            THEN 'HRIS_REQUIRED_HOSTED_SQL_READY' ELSE 'HRIS_REQUIRED_HOSTED_SQL_NOT_READY' END;
          ")"
          test "$result" = 'HRIS_REQUIRED_HOSTED_SQL_READY' || {
            echo '::error::Hosted SQL migration/RLS/storage gate failed; Pages not deployed'
            exit 1
          }
          echo 'PASS: hosted Profile, WFH, E06/E11 SQL, access controls, RLS and storage guards verified before Pages build'
      - name: Checkout deployed Candidate contract source for cross-repository tests
        shell: bash
        run: |
          set -euo pipefail
          candidate_branch=main
          expected_sha=db4163885f9609d66e9871a9c0de771fe8151d84
          git clone --depth 1 --branch "$candidate_branch" https://github.com/shihab-tech04/HRIS-Candidate-v2.git "$GITHUB_WORKSPACE/../HRIS-Candidate-v2"
          git -C "$GITHUB_WORKSPACE/../HRIS-Candidate-v2" fetch --no-tags --depth=1 origin "$expected_sha"
          git -C "$GITHUB_WORKSPACE/../HRIS-Candidate-v2" checkout --detach "$expected_sha"
          actual_sha="$(git -C "$GITHUB_WORKSPACE/../HRIS-Candidate-v2" rev-parse HEAD)"
          test "$actual_sha" = "$expected_sha" || { echo "::error::Candidate source contract SHA mismatch"; exit 1; }
          test -s "$GITHUB_WORKSPACE/../HRIS-Candidate-v2/src/lib/api.ts"
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Install dependencies
        run: npm ci --include=optional --no-audit --no-fund
      - name: TypeScript and static contract checks
        run: npm run lint && npm run test:contracts
      - name: Build GitHub Pages application
        env:
          GITHUB_PAGES: 'true'
          VITE_ENABLE_PLATFORM_TENANTS: 'true'
        run: npm run build
      - name: Verify the branch-served Pages entry matches the production build
        run: git diff --exit-code -- index.html assets .nojekyll
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke gate
        run: npm run test:e2e
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && inputs.release_approved == true
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify published HRIS compiled assets
        run: |
          set -euo pipefail
          base="https://shihab-tech04.github.io"
          for attempt in $(seq 1 20); do
            curl -fsSL -H 'Cache-Control: no-cache' "$base/HRIS-v2/?release=$GITHUB_SHA&attempt=$attempt" -o /tmp/hris-live.html || true
            if grep -Eq 'src="/HRIS-v2/assets/[^"]+\.js"' /tmp/hris-live.html &&
               grep -Eq 'href="/HRIS-v2/assets/[^"]+\.css"' /tmp/hris-live.html; then
              break
            fi
            sleep 3
          done
          grep -Eq 'src="/HRIS-v2/assets/[^"]+\.js"' /tmp/hris-live.html
          grep -Eq 'href="/HRIS-v2/assets/[^"]+\.css"' /tmp/hris-live.html
          js="$(grep -oE 'src="/HRIS-v2/assets/[^"]+\.js"' /tmp/hris-live.html | head -1 | cut -d '"' -f2)"
          css="$(grep -oE 'href="/HRIS-v2/assets/[^"]+\.css"' /tmp/hris-live.html | head -1 | cut -d '"' -f2)"
          curl -fsSL "$base$js" -o /tmp/hris-live.js
          curl -fsSL "$base$css" -o /tmp/hris-live.css
          test -s /tmp/hris-live.js
          test -s /tmp/hris-live.css
          grep -Fq 'Forgot password?' /tmp/hris-live.js
          echo "Preliminary PASS: live HRIS JS/CSS load; exact Main asset comparison follows"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify published HRIS compiled assets match exact protected Main
        shell: bash
        run: |
          set -euo pipefail
          base="https://shihab-tech04.github.io"
          # Build job verifies index.html/assets against the current Git commit.
          # Do not confuse an older but functional Pages bundle with this release.
          expected_js="$(grep -oE 'src="/HRIS-v2/assets/[^" ]+\.js"' index.html | head -1 | cut -d '"' -f2)"
          expected_css="$(grep -oE 'href="/HRIS-v2/assets/[^" ]+\.css"' index.html | head -1 | cut -d '"' -f2)"
          test -n "$expected_js" && test -n "$expected_css"
          expected_js_file="${expected_js#/HRIS-v2/}"
          expected_css_file="${expected_css#/HRIS-v2/}"
          test -s "$expected_js_file" && test -s "$expected_css_file"
          published=false
          for attempt in $(seq 1 20); do
            if curl -fsSL -H 'Cache-Control: no-cache' "$base/HRIS-v2/?release=$GITHUB_SHA&attempt=$attempt" -o /tmp/hris-live.html \
              && grep -Fq "src=\"$expected_js\"" /tmp/hris-live.html \
              && grep -Fq "href=\"$expected_css\"" /tmp/hris-live.html \
              && curl -fsSL -H 'Cache-Control: no-cache' "$base$expected_js?release=$GITHUB_SHA&attempt=$attempt" -o /tmp/hris-live.js \
              && curl -fsSL -H 'Cache-Control: no-cache' "$base$expected_css?release=$GITHUB_SHA&attempt=$attempt" -o /tmp/hris-live.css \
              && cmp -s "$expected_js_file" /tmp/hris-live.js \
              && cmp -s "$expected_css_file" /tmp/hris-live.css; then
              published=true
              break
            fi
            sleep 3
          done
          if [ "$published" != true ]; then
            echo '::error::Published Pages bundle does not match the exact protected Main assets'
            exit 1
          fi
          sha256sum "$expected_js_file" "$expected_css_file"
          echo "PASS: deployed JS/CSS byte-identical to exact Main $GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Install live browser verification dependencies
        run: npm ci --include=optional --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Verify published login and recovery screen with Chromium
        run: |
          node --input-type=module <<'NODE'
          import { chromium, expect } from '@playwright/test';
          const browser = await chromium.launch();
          try {
            const page = await browser.newPage();
            const errors = [];
            page.on('pageerror', error => errors.push(error.message));
            const response = await page.goto('https://shihab-tech04.github.io/HRIS-v2/', {
              waitUntil: 'domcontentloaded',
              timeout: 30000,
            });
            if (!response?.ok()) throw Error('Published HRIS returned HTTP ' + response?.status());
            await expect(page.getByRole('heading', { name: 'Sign in to your workspace' })).toBeVisible({ timeout: 15000 });
            await page.getByRole('button', { name: 'Forgot password?' }).click();
            await expect(page.getByRole('heading', { name: 'Reset your password' })).toBeVisible();
            await expect(page.getByLabel('Account email')).toBeVisible();
            await page.getByRole('button', { name: 'Back to sign in' }).click();
            await expect(page.getByRole('heading', { name: 'Sign in to your workspace' })).toBeVisible();
            if (errors.length) throw Error('Production React exceptions: ' + errors.join('; '));
            console.log('PASS: published HRIS login and recovery UI rendered in real Chromium');
          } finally {
            await browser.close();
          }
          NODE
