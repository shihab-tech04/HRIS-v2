name: One-shot Phase 03 hosted compatibility migration

on:
  push:
    branches:
      - checkpoint/phase03-hosted-cli-20261019
    paths:
      - .ops/phase03-hosted-transition/execute-20261019

permissions:
  contents: read

concurrency:
  group: synesis-hris-phase03-hosted-transition
  cancel-in-progress: false

jobs:
  apply-reviewed-migration:
    name: Apply only the pinned HRIS migration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: oslgwxaqfbteqtwqvdzs
      BASE_REMOTE_VERSION: "20261019100443"
      TARGET_VERSION: "20261019170600"
      EXPECTED_MIGRATION_BLOB: "5f62ab8e3bd8311306bb6cff0bbd89a918f6cd63"
      SOURCE_MIGRATION: supabase/staging/phase03/20261019_phase03_phase04_hosted_compatibility.staging.sql
      WORKDIR: ${{ runner.temp }}/synesis-phase03-hosted-transition
    steps:
      - name: Check out this checkpoint
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1

      - name: Verify pinned migration and required credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" != "checkpoint/phase03-hosted-cli-20261019" ]]; then
            echo "Refusing deployment outside the isolated checkpoint branch."
            exit 1
          fi
          if [[ -z "$SUPABASE_ACCESS_TOKEN" || -z "$SUPABASE_DB_PASSWORD" ]]; then
            echo "Required Supabase CLI secrets are unavailable; no database action was attempted."
            exit 1
          fi
          actual_blob="$(git hash-object "$SOURCE_MIGRATION")"
          if [[ "$actual_blob" != "$EXPECTED_MIGRATION_BLOB" ]]; then
            echo "Refusing deployment: staged source blob differs from the reviewed migration."
            exit 1
          fi
          mkdir -p "$WORKDIR/supabase/migrations"
          printf 'project_id = "synesis-phase03-hosted-transition"\n' > "$WORKDIR/supabase/config.toml"
          cp "$SOURCE_MIGRATION" "$WORKDIR/supabase/migrations/${TARGET_VERSION}_phase03_phase04_hosted_compatibility.sql"
          copied_blob="$(git hash-object "$WORKDIR/supabase/migrations/${TARGET_VERSION}_phase03_phase04_hosted_compatibility.sql")"
          if [[ "$copied_blob" != "$EXPECTED_MIGRATION_BLOB" ]]; then
            echo "Refusing deployment: CLI migration copy differs from the reviewed source."
            exit 1
          fi
          supabase --version
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --workdir "$WORKDIR"

      - name: Check migration history and dry-run exactly one migration
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKDIR"
          supabase migration list --linked --workdir "$WORKDIR" > "$RUNNER_TEMP/migrations-before.txt" 2>&1
          node <<'NODE'
          const fs = require('node:fs');
          const lines = fs.readFileSync(process.env.RUNNER_TEMP + '/migrations-before.txt', 'utf8').split(/\r?\n/);
          const local = new Set(), remote = new Set();
          for (const line of lines) {
            const cells = line.split(/[|│]/);
            if (cells.length < 2) continue;
            for (const v of (cells[0].match(/\b20\d{12}\b/g) || [])) local.add(v);
            for (const cell of cells.slice(1)) {
              for (const v of (cell.match(/\b20\d{12}\b/g) || [])) remote.add(v);
            }
          }
          const latest = [...remote].sort().at(-1);
          if (latest !== process.env.BASE_REMOTE_VERSION) {
            throw new Error('Refusing deployment: hosted migration head changed from the reviewed version.');
          }
          if (!remote.has(process.env.BASE_REMOTE_VERSION) || remote.has(process.env.TARGET_VERSION)) {
            throw new Error('Refusing deployment: target migration history is missing or already applied.');
          }
          if (local.size !== 1 || !local.has(process.env.TARGET_VERSION)) {
            throw new Error('Refusing deployment: isolated CLI workdir does not contain exactly the pinned migration.');
          }
          console.log('History preflight passed: expected remote head and one unapplied local migration.');
          NODE
          supabase db push --dry-run --linked --workdir "$WORKDIR" > "$RUNNER_TEMP/migration-dry-run.txt" 2>&1
          cat "$RUNNER_TEMP/migration-dry-run.txt"
          grep -F "$TARGET_VERSION" "$RUNNER_TEMP/migration-dry-run.txt" >/dev/null
          cp "$RUNNER_TEMP/migrations-before.txt" "$WORKDIR/migrations-before.txt"
          cp "$RUNNER_TEMP/migration-dry-run.txt" "$WORKDIR/migration-dry-run.txt"

      - name: Recheck remote head and apply the tracked migration
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKDIR"
          supabase migration list --linked --workdir "$WORKDIR" > "$RUNNER_TEMP/migrations-immediate-prepush.txt" 2>&1
          node <<'NODE'
          const fs = require('node:fs');
          const lines = fs.readFileSync(process.env.RUNNER_TEMP + '/migrations-immediate-prepush.txt', 'utf8').split(/\r?\n/);
          const remote = new Set();
          for (const line of lines) {
            const cells = line.split(/[|│]/);
            for (const cell of cells.slice(1)) {
              for (const v of (cell.match(/\b20\d{12}\b/g) || [])) remote.add(v);
            }
          }
          const latest = [...remote].sort().at(-1);
          if (latest !== process.env.BASE_REMOTE_VERSION || remote.has(process.env.TARGET_VERSION)) {
            throw new Error('Refusing write: hosted migration head changed during preflight.');
          }
          NODE
          supabase db push --linked --workdir "$WORKDIR"
          supabase migration list --linked --workdir "$WORKDIR" > "$RUNNER_TEMP/migrations-after.txt" 2>&1
          node <<'NODE'
          const fs = require('node:fs');
          function remoteVersions(file) {
            const set = new Set();
            for (const line of fs.readFileSync(process.env.RUNNER_TEMP + '/' + file, 'utf8').split(/\r?\n/)) {
              const cells = line.split(/[|│]/);
              for (const cell of cells.slice(1)) {
                for (const v of (cell.match(/\b20\d{12}\b/g) || [])) set.add(v);
              }
            }
            return set;
          }
          const before = remoteVersions('migrations-immediate-prepush.txt');
          const after = remoteVersions('migrations-after.txt');
          const added = [...after].filter(v => !before.has(v));
          if (added.length !== 1 || added[0] !== process.env.TARGET_VERSION) {
            throw new Error('Migration history postflight does not show exactly the intended new version.');
          }
          console.log('Migration history postflight passed: only the pinned target version was added.');
          NODE
          cp "$RUNNER_TEMP/migrations-after.txt" "$WORKDIR/migrations-after.txt"

      - name: Preserve migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase03-hosted-migration-evidence
          path: |
            ${{ runner.temp }}/migrations-before.txt
            ${{ runner.temp }}/migration-dry-run.txt
            ${{ runner.temp }}/migrations-immediate-prepush.txt
            ${{ runner.temp }}/migrations-after.txt
          if-no-files-found: ignore
          retention-days: 30
