# One-shot HRIS recovery operation; branch-scoped and no production SQL writes.
name: WS05 PR162 source preservation and read-only DB backup request
on:
  push:
    branches:
      - feat/ws01-single-super-admin-tenant-ux-20261103
    paths:
      - .github/workflows/pr162-one-shot-recovery.yml
permissions:
  contents: read
concurrency:
  group: ws05-pr162-one-shot-recovery
  cancel-in-progress: false
jobs:
  source-bundle:
    if: github.repository == 'shihab-tech04/HRIS-v2' && github.ref == 'refs/heads/feat/ws01-single-super-admin-tenant-ux-20261103'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bundle full history and verify an independent offline restoration
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          git rev-parse --is-shallow-repository | grep -Fx false
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          test "$main_sha" = d4fa35a9abe470a75a8484352e66b93c5a23b1f8
          git cat-file -e "${GITHUB_SHA}^{commit}"
          git bundle create "$RUNNER_TEMP/hris-pr162-pre-release.git.bundle" --all
          git bundle verify "$RUNNER_TEMP/hris-pr162-pre-release.git.bundle"
          git clone -q --mirror "$RUNNER_TEMP/hris-pr162-pre-release.git.bundle" "$RUNNER_TEMP/hris-offline-restore.git"
          git -C "$RUNNER_TEMP/hris-offline-restore.git" cat-file -e "${GITHUB_SHA}^{commit}"
          git -C "$RUNNER_TEMP/hris-offline-restore.git" cat-file -e "${main_sha}^{commit}"
          printf 'repository=shihab-tech04/HRIS-v2\nmain_sha=%s\npr_head=%s\ncreated_utc=%s\nrestore=git clone --mirror hris-pr162-pre-release.git.bundle restored.git\n' "$main_sha" "$GITHUB_SHA" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > "$RUNNER_TEMP/hris-pr162-manifest.txt"
          (cd "$RUNNER_TEMP" && sha256sum hris-pr162-pre-release.git.bundle hris-pr162-manifest.txt > hris-pr162-sha256.txt)
          echo "PASS: Complete Git bundle restored offline and both immutable commits verified."
      - name: Preserve source bundle for independent Drive transfer
        uses: actions/upload-artifact@v4
        with:
          name: hris-pr162-independent-git-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/hris-pr162-pre-release.git.bundle
            ${{ runner.temp }}/hris-pr162-manifest.txt
            ${{ runner.temp }}/hris-pr162-sha256.txt
          if-no-files-found: error
          retention-days: 2
  encrypted-db-export:
    if: github.repository == 'shihab-tech04/HRIS-v2' && github.ref == 'refs/heads/feat/ws01-single-super-admin-tenant-ux-20261103'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch existing trusted Main read-only encrypted PostgreSQL backup
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(gh api repos/shihab-tech04/HRIS-v2/git/ref/heads/main --jq '.object.sha')"
          test "$main_sha" = d4fa35a9abe470a75a8484352e66b93c5a23b1f8
          gh workflow run hris-step1-encrypted-db-export.yml \
            --repo shihab-tech04/HRIS-v2 --ref main \
            -f session_pooler_host=aws-0-ap-northeast-2.pooler.supabase.com
          echo "PASS: Existing read-only encrypted SQL export workflow requested on pinned Main."
          echo "No hosted DML, DDL, deploy, or Auth operations."
