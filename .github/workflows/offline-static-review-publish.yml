name: HRIS static offline visual review — Git source (never production Pages)
on:
  push:
    branches: [review/hris-static-web-20261022]
    paths-ignore:
      - 'review-site/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hris-offline-review-publish
  cancel-in-progress: false
jobs:
  offline-static:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - run: npm install --include=optional --no-audit --no-fund
      - name: Verify offline contracts and build Vite with relative asset paths
        run: |
          node --test tests/contracts/frontend-review-isolation.test.mjs
          npm run lint
          HRIS_FRONTEND_REVIEW=true VITE_HRIS_FRONTEND_REVIEW=true npx vite build --base=./
      - name: Fail closed on any hosted HRIS database connection or wrong assets
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/app.html
          grep -Eq 'src="./assets/[^"]+\.js"' dist/app.html
          grep -Eq 'href="./assets/[^"]+\.css"' dist/app.html
          ! grep -R -F 'oslgwxaqfbteqtwqvdzs.supabase.co' dist/assets
          ! grep -R -F 'VITE_SUPABASE_ANON_KEY' dist/assets
      - name: Stage immutable, public, synthetic-only static review files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf review-site
          mkdir -p review-site
          cp -a dist/. review-site/
          cp dist/app.html review-site/index.html
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const file = 'review-site/index.html';
          let html = readFileSync(file,'utf8');
          html = html.replace('</head>', '<meta name="robots" content="noindex,nofollow,noarchive" /></head>');
          if (!html.includes('src="./assets/') || !html.includes('href="./assets/')) {
            throw new Error('Review site must use relative assets');
          }
          writeFileSync(file, html);
          NODE
          git add -- review-site
          if git diff --cached --quiet; then echo "Review assets unchanged"; exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(review): publish isolated offline Main HRIS visual assets [skip ci]'
          git push origin HEAD:refs/heads/review/hris-static-web-20261022
      - name: Report review-only publishing boundary
        run: |
          echo "Assets in review-site/ on a dedicated non-production branch."
          echo "GitHub Pages production workflow is NOT used."
