# Independent restore of an existing encrypted HRIS backup. Never connects to a hosted DB.
# The locally bootstrapped supabase_admin superuser, not production credentials,
# performs the isolated restore of source objects with privileged GUC settings.
# Runs once on the trusted main merge of THIS workflow file; manual dispatch for retry.
name: "HRIS Step 1 - Isolated PostgreSQL restore proof"
on:
  push:
    branches: [main]
    paths: ['.github/workflows/hris-step1-offline-restore-proof.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: hris-step1-offline-restore-proof
  cancel-in-progress: false

jobs:
  restore-proof:
    if: ${{ github.repository == 'shihab-tech04/HRIS-v2' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'
      SUPABASE_HOME: /tmp/hris-supabase-home
      HRIS_RESTORE_WORKDIR: /tmp/synesis-local-hris-restore
    steps:
      - name: Fetch exact encrypted backup from trusted completed run
        uses: actions/download-artifact@v4
        with:
          name: hris-db-encrypted-40084995271
          run-id: 40084995271
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/hris-restore-source

      - name: Verify encryption archive and authenticate decryption
        shell: bash
        env:
          HRIS_BACKUP_PASSPHRASE: ${{ secrets.HRIS_BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          test "${#HRIS_BACKUP_PASSPHRASE}" -ge 32 || { echo "::error::Backup passphrase unavailable"; exit 1; }
          src="${RUNNER_TEMP}/hris-restore-source"
          test -s "$src/hris-replacement-40084995271.pgcustom.gpg"
          (cd "$src" && sha256sum --check --status encrypted.sha256)
          grep -Fxq "source_project=xfuxnljfrgvusbrpvxpa" "$src/backup-manifest.txt"
          grep -Fxq "github_run_id=40084995271" "$src/backup-manifest.txt"
          plain="${RUNNER_TEMP}/hris-recovered.pgcustom"
          gpg --batch --yes --quiet --pinentry-mode loopback \
            --passphrase-fd 3 --output "$plain" --decrypt \
            "$src/hris-replacement-40084995271.pgcustom.gpg" 3<<<"$HRIS_BACKUP_PASSPHRASE"
          test -s "$plain"
          expected="$(sed -n 's/^plaintext_archive_sha256=//p' "$src/backup-manifest.txt")"
          test "${#expected}" = 64
          printf '%s  %s\n' "$expected" "$plain" | sha256sum --check --status
          docker run --rm --mount "type=bind,src=${RUNNER_TEMP},dst=/restore,readonly" postgres:17-alpine \
            pg_restore --list /restore/hris-recovered.pgcustom > "${RUNNER_TEMP}/hris-restore-inventory.txt"
          test "$(wc -l < "${RUNNER_TEMP}/hris-restore-inventory.txt")" -gt 100
          echo "PASS: pinned encrypted backup decrypted; SHA-256 and pg_restore inventory verified."

      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Create isolated local Supabase PostgreSQL 17 environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HRIS_RESTORE_WORKDIR"
          supabase init --workdir "$HRIS_RESTORE_WORKDIR" --force >/dev/null
          sed -i 's/^port = 54321$/port = 55421/' "$HRIS_RESTORE_WORKDIR/supabase/config.toml"
          sed -i 's/^port = 54322$/port = 55422/' "$HRIS_RESTORE_WORKDIR/supabase/config.toml"
          if ! supabase start --workdir "$HRIS_RESTORE_WORKDIR" \
            --exclude studio,edge-runtime,logflare,vector,supavisor >"${RUNNER_TEMP}/hris-local-start.log" 2>&1; then
            echo "::error::Isolated local Supabase failed to start. No hosted database was accessed."
            exit 1
          fi
          echo "Isolated local Supabase ready; never uses hosted project credentials."

      - name: Restore source archive in isolated local PostgreSQL, then verify critical data
        shell: bash
        run: |
          set -euo pipefail
          # Full restore must use a fresh empty database, not the local Supabase
          # bootstrap 'postgres' DB whose pre-existing system objects can collide.
          docker run --rm --network host --env PGPASSWORD=postgres postgres:17-alpine \
            createdb --host 127.0.0.1 --port 55422 --username postgres hris_recovered_isolated

          # The platform's source archive contains functions with privileged
          # per-function GUCs (e.g. log_min_messages). PostgreSQL correctly
          # rejects those under the restricted postgres role even in a
          # disposable database. Use the local-only Supabase bootstrap admin
          # role *only after* confirming its superuser flag and credentials.
          # This does not grant anything on the hosted Supabase instance.
          if ! docker run --rm --network host --env PGPASSWORD=postgres postgres:17-alpine \
            psql --host 127.0.0.1 --port 55422 --username supabase_admin \
              --dbname hris_recovered_isolated -X -A -t -v ON_ERROR_STOP=1 \
              -c "SELECT CASE WHEN current_setting('is_superuser')='on' THEN 'ISOLATED_SUPERUSER_VERIFIED' ELSE 'DENIED' END;" \
            | grep -Fx 'ISOLATED_SUPERUSER_VERIFIED'; then
            echo "::error::No verified local-only superuser restore role. Hosted access unchanged."
            exit 1
          fi

          # Full replay in explicit TOC order. In this raw platform archive
          # audit entries depend on auth.users and an existing FK would block
          # a one-pass table-data restore; pre-data -> data -> post-data ensures
          # constraints are created after their referenced rows are loaded.
          # Fail-closed: we DO NOT turn off FK enforcement or ignore errors.
          # Replacement source has 58 preexisting audit actor references to
          # deleted historical Auth users, even with convalidated=true.
          # Keep every original row/UUID intact. The one legacy FK is replayed
          # below as NOT VALID (still enforced for future writes), rather than
          # silently dropping audit history or fabricating Auth users.
          archive_toc="${RUNNER_TEMP}/hris-restore-inventory.txt"
          excluded_fk="${RUNNER_TEMP}/hris-legacy-audit-fk-postdata.toc"
          match_count="$(grep -Ec 'FK CONSTRAINT.*admin_audit_logs_actor_id_fkey' "$archive_toc" || true)"
          if [[ "$match_count" != 1 ]]; then
            echo "::error::Pinned archive lacks exactly one expected audit FK item."
            exit 1
          fi
          sed -E '/FK CONSTRAINT.*admin_audit_logs_actor_id_fkey/s/^/;/' "$archive_toc" >"$excluded_fk"

          restore_failed_section=''
          restore_log="${RUNNER_TEMP}/hris-restore-log.txt"
          : >"$restore_log"
          for section in pre-data data post-data; do
            section_args=()
            if [[ "$section" == "post-data" ]]; then
              section_args=(--use-list=/restore/hris-legacy-audit-fk-postdata.toc)
            fi
            if ! docker run --rm --network host \
              --env PGPASSWORD=postgres \
              --mount "type=bind,src=${RUNNER_TEMP},dst=/restore,readonly" \
              postgres:17-alpine \
              pg_restore --host 127.0.0.1 --port 55422 --username supabase_admin \
                --dbname hris_recovered_isolated --no-owner --no-acl \
                --section="$section" "${section_args[@]}" --exit-on-error --verbose \
                /restore/hris-recovered.pgcustom >>"$restore_log" 2>&1; then
              restore_failed_section="$section"
              break
            fi
          done
          if [[ -n "$restore_failed_section" ]]; then
            echo "::notice::Isolated restore failed in section: $restore_failed_section"
            # Emit only the first short PostgreSQL error (not SQL/data/row details).
            # Mask emails, UUIDs and quoted literal text before public CI output.
            first_error="$(grep -m1 'ERROR:' "${RUNNER_TEMP}/hris-restore-log.txt" || true)"
            if [[ -n "$first_error" ]]; then
              safe_error="$(printf '%s' "$first_error" | sed -E \
                -e 's/[[:alnum:]._%+-]+@[[:alnum:].-]+/[EMAIL]/g' \
                -e 's/[[:xdigit:]]{8}(-[[:xdigit:]]{4}){3}-[[:xdigit:]]{12}/[UUID]/g' \
                -e "s/'[^']*'/[LITERAL]/g" | cut -c1-200)"
              echo "::notice::Sanitized first PostgreSQL error: $safe_error"
            fi
            # Print only a classification, not source SQL or private data.
            if grep -Eiq 'already exists|duplicate object' "${RUNNER_TEMP}/hris-restore-log.txt"; then
              echo "::error::Isolated restore encountered existing-object conflict."
            elif grep -Eiq 'does not exist|not installed|could not open extension' "${RUNNER_TEMP}/hris-restore-log.txt"; then
              echo "::error::Isolated restore requires unavailable Supabase-managed dependency."
            elif grep -Eiq 'permission denied|must be owner|superuser' "${RUNNER_TEMP}/hris-restore-log.txt"; then
              echo "::error::Isolated restore encountered privilege mismatch."
            else
              echo "::error::Isolated restore failed; encrypted backup integrity remains separately verified."
            fi
            exit 1
          fi
          # Explicitly verify exact pinned-source legacy drift before altering
          # *only this disposable database's* FK validity state.
          legacy_probe="SELECT CASE WHEN
            (SELECT COUNT(*) FROM public.admin_audit_logs)=61
            AND (SELECT COUNT(*) FROM public.admin_audit_logs WHERE actor_id IS NOT NULL)=59
            AND (SELECT COUNT(*) FROM auth.users)=1
            AND (SELECT COUNT(*) FROM public.admin_audit_logs a
                 LEFT JOIN auth.users u ON u.id=a.actor_id
                 WHERE a.actor_id IS NOT NULL AND u.id IS NULL)=58
            THEN 'PINNED_LEGACY_FK_DRIFT_VERIFIED' ELSE 'LEGACY_DRIFT_MISMATCH' END;"
          docker run --rm --network host --env PGPASSWORD=postgres postgres:17-alpine \
            psql --host 127.0.0.1 --port 55422 --username supabase_admin \
              --dbname hris_recovered_isolated -X -A -t -v ON_ERROR_STOP=1 -c "$legacy_probe" \
            | grep -Fx "PINNED_LEGACY_FK_DRIFT_VERIFIED"

          docker run --rm --network host --env PGPASSWORD=postgres postgres:17-alpine \
            psql --host 127.0.0.1 --port 55422 --username supabase_admin \
              --dbname hris_recovered_isolated -X -v ON_ERROR_STOP=1 \
              -c 'ALTER TABLE public.admin_audit_logs ADD CONSTRAINT admin_audit_logs_actor_id_fkey FOREIGN KEY (actor_id) REFERENCES auth.users(id) ON DELETE SET NULL NOT VALID;' \
              >/dev/null
          echo "RECOVERY_EXCEPTION: legacy 58 orphaned audit actor references retained unchanged; FK NOT VALID on isolated restore only."

          probe="SELECT CASE WHEN to_regclass('public.tenants') IS NOT NULL
             AND to_regclass('public.admin_users') IS NOT NULL
             AND to_regclass('public.employees') IS NOT NULL
             AND (SELECT COUNT(*) FROM public.tenants) >= 1
             AND (SELECT COUNT(*) FROM public.admin_users) >= 1
             AND to_regclass('auth.users') IS NOT NULL
             AND (SELECT COUNT(*) FROM auth.users) >= 1
             AND (SELECT COUNT(*) FROM public.admin_audit_logs a
                  LEFT JOIN auth.users u ON u.id=a.actor_id
                  WHERE a.actor_id IS NOT NULL AND u.id IS NULL)=58
             AND EXISTS (SELECT 1 FROM pg_constraint
                  WHERE conrelid='public.admin_audit_logs'::regclass
                    AND conname='admin_audit_logs_actor_id_fkey'
                    AND contype='f' AND NOT convalidated)
             AND to_regclass('supabase_migrations.schema_migrations') IS NOT NULL
             AND (SELECT COUNT(*) FROM supabase_migrations.schema_migrations) >= 110
             THEN 'ISOLATED_RESTORE_WITH_DOCUMENTED_LEGACY_FK_EXCEPTION' ELSE 'ISOLATED_RESTORE_INCOMPLETE' END;"
          docker run --rm --network host --env PGPASSWORD=postgres postgres:17-alpine \
            psql --host 127.0.0.1 --port 55422 --username postgres \
              --dbname hris_recovered_isolated -X -A -t -v ON_ERROR_STOP=1 -c "$probe" \
            | grep -Fx "ISOLATED_RESTORE_WITH_DOCUMENTED_LEGACY_FK_EXCEPTION"
          echo "PASS: isolated restore with pinned 58-row historical FK exception, NOT a clean byte-for-byte schema restoration."
          echo "Not a live HRIS functional acceptance or Supabase Storage files/secrets restore."

      - name: Stop disposable local Supabase only
        if: always()
        shell: bash
        run: |
          supabase stop --workdir "$HRIS_RESTORE_WORKDIR" --no-backup >/dev/null 2>&1 || true
          rm -f "${RUNNER_TEMP}/hris-recovered.pgcustom" || true
