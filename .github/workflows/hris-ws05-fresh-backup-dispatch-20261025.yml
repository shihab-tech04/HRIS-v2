# One-time protected-Main dispatch; separate from any deployment or SQL write.
# The target existing backup job exports via read-only PG17 and encrypts before artifact upload.
name: "WS05 - One-time fresh encrypted HRIS backup"
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hris-ws05-fresh-backup-dispatch-20261025.yml
      - .github/workflows/hris-release1-platform-access-sql-release.yml
      - .github/workflows/hris-step1-encrypted-db-export.yml
      - .github/workflows/hris-step1-offline-restore-proof.yml
      - .github/workflows/hris-current-main-source-backup.yml
      - .github/workflows/hris-employee-avatar-sql-release.yml
      - .github/scripts/hris-legacy-auth-fk-counts.sql

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: ${{ github.repository == 'shihab-tech04/HRIS-v2' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Verify exact protected Main and dispatch read-only encrypted export
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          actual="$(gh api repos/shihab-tech04/HRIS-v2/branches/main --jq '.commit.sha')"
          if [[ "$actual" != "$GITHUB_SHA" ]]; then
            echo "::error::Protected Main moved. No backup dispatched."
            exit 1
          fi
          gh workflow run hris-step1-encrypted-db-export.yml \
            --repo shihab-tech04/HRIS-v2 --ref main \
            -f session_pooler_host=aws-0-ap-northeast-2.pooler.supabase.com
          echo 'Fresh encrypted replacement Supabase export dispatched.'
          echo 'No hosted DDL, deployment, or invitation email was triggered.'

      - name: Dispatch isolated restore only after exact protected-Main export succeeds
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'shihab-tech04/HRIS-v2'
          test "$GITHUB_REF" = 'refs/heads/main'
          # Explicit workflow_dispatch is permitted with the repository GITHUB_TOKEN;
          # do not rely on an indirect workflow_run chain for the recovery proof.
          run_id=''
          status=''
          conclusion=''
          for attempt in $(seq 1 90); do
            payload="$(gh api 'repos/shihab-tech04/HRIS-v2/actions/runs?branch=main&per_page=25')"
            run_id="$(jq -r --arg sha "$GITHUB_SHA" '
              [.workflow_runs[] | select(.name == "HRIS Step 1 - Encrypted database export"
                and .event == "workflow_dispatch" and .head_branch == "main"
                and .head_sha == $sha)] | sort_by(.id) | last | .id // empty
            ' <<<"$payload")"
            if [[ -n "$run_id" ]]; then
              status="$(jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id) | .status' <<<"$payload")"
              conclusion="$(jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id) | .conclusion // empty' <<<"$payload")"
              if [[ "$status" == completed ]]; then
                [[ "$conclusion" == success ]] || {
                  echo '::error::Exact-Main encrypted export failed. No restore dispatched.'; exit 1;
                }
                break
              fi
            fi
            sleep 10
          done
          [[ -n "$run_id" && "$status" == completed && "$conclusion" == success ]] || {
            echo '::error::Exact-Main export completion not confirmed. No restore dispatched.'; exit 1;
          }
          gh api "repos/shihab-tech04/HRIS-v2/actions/runs/${run_id}/artifacts?per_page=100" \
            | jq -e --arg name "hris-db-encrypted-${run_id}" \
                '[.artifacts[] | select(.name == $name and .expired == false and .size_in_bytes > 0)] | length == 1' \
            >/dev/null || { echo '::error::Encrypted artifact absent; restore not dispatched.'; exit 1; }
          gh workflow run hris-step1-offline-restore-proof.yml \
            --repo shihab-tech04/HRIS-v2 --ref main \
            -f backup_run_id="$run_id"
          echo "Exact protected-Main export verified; isolated restore dispatched for run $run_id."
          echo 'No production SQL, Auth, Edge Function, Pages or data mutations performed.'

# HRIS clean-baseline recovery request (2026-11-04): refresh the encrypted
# replacement database backup after employee data cleanup. This dispatcher
# remains protected-Main-only and read-only; it does not apply SQL or deploy.

# HRIS 2026-11-06 pre-release recovery: on protected Main merge, dispatch an
# existing encrypted, read-only PostgreSQL export. This does NOT approve or
# dispatch the subsequent SQL or Pages production release.

# HRIS 2026-11-08: one-time protected-Main encrypted backup refresh after
# the exact-run offline restore proof gate is upgraded. Still read-only.
