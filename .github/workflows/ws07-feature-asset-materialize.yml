name: WS07 feature branch Pages asset sync
on:
  push:
    branches:
      - work/ws07-feature-job-circular-create-publish-20261024
permissions:
  contents: write
jobs:
  materialize-feature-assets:
    if: github.repository == 'shihab-tech04/HRIS-v2' && github.ref == 'refs/heads/work/ws07-feature-job-circular-create-publish-20261024'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build exact Pages bundle on isolated feature branch
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Commit generated Pages fingerprint to feature branch only
        run: |
          set -euo pipefail
          test -s index.html
          test -d assets
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html assets/ .nojekyll
          if git diff --cached --quiet; then
            echo "Feature bundle is already synchronized"
            exit 0
          fi
          git commit -m 'chore(ws07): synchronize actual Pages build artifacts'
          git push origin HEAD:work/ws07-feature-job-circular-create-publish-20261024
