name: WS05 approved Main HR11 frontend-only release
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ws05-hr11-approved-pages-dispatch.yml
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    if: github.repository == 'shihab-tech04/HRIS-v2' && github.ref == 'refs/heads/main' && github.actor == 'shihab-tech04'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm exact accepted frontend source and unchanged approval gate
        shell: bash
        run: |
          set -euo pipefail
          base=f0440303bf6c1b7ab8eda053152be3c3c2ac503b
          git merge-base --is-ancestor "$base" HEAD
          changed="$(git diff --name-only "$base" HEAD)"
          test "$changed" = '.github/workflows/ws05-hr11-approved-pages-dispatch.yml'
          grep -Fq 'workflow_dispatch:' .github/workflows/deploy-pages.yml
          grep -Fq 'inputs.release_approved == true' .github/workflows/deploy-pages.yml
          grep -Fq "actions/deploy-pages@v4" .github/workflows/deploy-pages.yml
          grep -Fq "application_deadline: draft.deadline || null" src/live/JobCircularManager.tsx
          grep -Fq "['full-time','part-time','contract','internship']" src/live/JobCircularManager.tsx
          test -s index.html
          echo 'Approved HR11 source, Pages assets and release gate verified'
      - name: Request owner-approved existing Pages frontend deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-pages.yml/dispatches" \
            -f ref=main \
            -F 'inputs[release_approved]=true'
          echo 'Existing Pages release workflow dispatched'
