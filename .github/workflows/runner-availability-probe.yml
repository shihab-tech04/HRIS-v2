name: Standard runner availability probe (no secrets)
on:
  push:
    branches: [development/hris-checkpoints]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: github.ref == 'refs/heads/development/hris-checkpoints'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Confirm the trusted development branch can start a standard public runner
        run: echo "PASS: ubuntu-24.04 runner started for the development checkpoint branch."
