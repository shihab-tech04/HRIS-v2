name: Verify HRIS build and browser smoke
on:
  push:
    branches: [release/hris-stable-20261017]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    if: github.ref == 'refs/heads/development/hris-checkpoints' || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/release/')) || (github.event_name == 'push' && github.ref == 'refs/heads/release/hris-stable-20261017')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Checkout the matching Candidate release for cross-repository contracts
        if: github.ref == 'refs/heads/release/hris-stable-20261017'
        run: git clone --depth 1 --branch release/candidate-stable-20261017 https://github.com/shihab-tech04/HRIS-Candidate-v2.git "$GITHUB_WORKSPACE/../HRIS-Candidate-v2"
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript check
        run: npm run lint
      - name: Contract source checks (not RLS runtime tests)
        run: npm run test:contracts
      - name: Build HRIS bundle
        run: npm run build
      - name: Verify the branch-served Pages entry matches the production build
        run: git diff --exit-code -- index.html assets .nojekyll
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Actual browser responsive/sign-in smoke
        run: npm run test:e2e
