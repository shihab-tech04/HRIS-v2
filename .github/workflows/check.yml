name: Verify HRIS build and browser smoke
on:
  pull_request:
    branches: [main, integration/ws05-main-final-review-20261022]
  push:
    branches: [release/hris-stable-20261017]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/development/hris-checkpoints' || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/release/')) || (github.event_name == 'push' && github.ref == 'refs/heads/release/hris-stable-20261017')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Checkout the matching Candidate release for cross-repository contracts
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/release/hris-stable-20261017'
        run: |
          branch=main
          expected_sha=39d07585c854709f5c16b2712a6634da386c5c4d
          if [ "$GITHUB_REF" = 'refs/heads/release/hris-stable-20261017' ]; then
            branch=release/candidate-stable-20261017
            expected_sha=
          fi
          git clone --depth 1 --branch "$branch" https://github.com/shihab-tech04/HRIS-Candidate-v2.git "$GITHUB_WORKSPACE/../HRIS-Candidate-v2"
          # Pin the currently deployed Candidate runtime for exact cross-repository checks.
          # Do not silently accept a newer Candidate commit before its Pages release.
          if [ -n "$expected_sha" ]; then
            git -C "$GITHUB_WORKSPACE/../HRIS-Candidate-v2" fetch --no-tags --depth=1 origin "$expected_sha"
            git -C "$GITHUB_WORKSPACE/../HRIS-Candidate-v2" checkout --detach "$expected_sha"
          fi
          actual_sha="$(git -C "$GITHUB_WORKSPACE/../HRIS-Candidate-v2" rev-parse HEAD)"
          echo "Candidate contract ref: $branch at $actual_sha"
          if [ -n "$expected_sha" ] && [ "$actual_sha" != "$expected_sha" ]; then
            echo "::error::Candidate release commit drift: expected $expected_sha, observed $actual_sha" >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Install dependencies
        run: npm install --include=optional --no-audit --no-fund
      - name: TypeScript check
        run: npm run lint
      - name: Contract source checks (not RLS runtime tests)
        run: npm run test:contracts
      - name: Build HRIS bundle
        env:
          VITE_ENABLE_PLATFORM_TENANTS: 'true'
        run: npm run build
      - name: Preserve the exact Pages build for release review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hris-pages-build-${{ github.sha }}
          path: dist/
          if-no-files-found: ignore
          retention-days: 2
      - name: Verify the branch-served Pages entry matches the production build
        run: git diff --exit-code -- index.html assets .nojekyll
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Actual browser responsive/sign-in smoke
        run: npm run test:e2e
