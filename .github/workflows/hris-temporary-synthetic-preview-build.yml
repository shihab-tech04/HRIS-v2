name: HRIS temporary one-time synthetic preview route removal asset build
on:
  push:
    branches:
      - fix/hris-single-admin-synthetic-preview-route-20261104
permissions:
  contents: write
jobs:
  compile-reviewed-assets:
    if: github.repository == 'shihab-tech04/HRIS-v2' && github.ref == 'refs/heads/fix/hris-single-admin-synthetic-preview-route-20261104' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true
      - name: Pin reviewed source and forbidden preview navigation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'eccca019e724ff47dd85bcb53f7f996dd075517e'
          ! grep -q "page === 'user-management-preview'" src/live/LiveHrisWorkspace.tsx
          ! grep -q "SyntheticUserManagement" src/live/LiveHrisWorkspace.tsx
          test -s tests/browser/synthetic-user-management.spec.ts
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Install locked dependencies
        run: npm ci --include=optional --no-audit --no-fund
      - name: Validate changed source and contract tests
        run: |
          npm run lint
          npm run test:contracts
      - name: Build exact Pages assets (do not deploy)
        env:
          GITHUB_PAGES: 'true'
          VITE_ENABLE_PLATFORM_TENANTS: 'true'
        run: npm run build
      - name: Commit exact generated Pages assets to source branch
        shell: bash
        run: |
          set -euo pipefail
          git add index.html assets .nojekyll
          test -s index.html
          test -s dist/index.html
          if git diff --cached --quiet; then
            echo '::error::No generated assets changed despite route removal'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: synchronize sole Super Admin Pages assets with preview route removal'
          git push origin HEAD:refs/heads/fix/hris-single-admin-synthetic-preview-route-20261104
          echo 'PASS: source branch compiled assets synchronized (not deployed)'
