name: HRIS independent Figma geometry verification (no deploy)
on:
  push:
    branches: [work/hris-figma-verification-20261021]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-figma:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Checkout trusted Candidate sibling for contract parity
        run: git clone --depth 1 --branch development/hris-checkpoints https://github.com/shihab-tech04/HRIS-Candidate-v2.git "$GITHUB_WORKSPACE/../HRIS-Candidate-v2"
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Install source dependencies
        run: npm install --include=optional --no-audit --no-fund
      - name: TypeScript and contract checks
        run: npm run lint && npm run test:contracts
      - name: Build UI without deployment
        run: npx vite build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify Manager Attendance Figma 17:28694
        run: npx playwright test tests/browser/ws08-manager-attendance-report.spec.ts --project=chromium
      - name: Verify remaining browser regressions
        run: npm run test:e2e
      - name: Save exact-head UI visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: direct-figma-geometry-${{ github.sha }}
          path: |
            docs/evidence/ws08/*.png
            docs/evidence/ws01-shell/*.png
            test-results/
          if-no-files-found: ignore
          retention-days: 7
