name: WS04 exact-release visual evidence (no deploy)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-main-visual-evidence:
    # Only the existing WS04 independent QA PR may invoke this focused evidence job.
    # App source comes strictly from the fixed, approved-for-QA WS05 release SHA,
    # never from the older evidence branch. No hosted login, DDL, merge or deploy.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.number == 45 && github.head_ref == 'audit/hris-figma-parity-20261020')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MAIN_RELEASE_SHA: aa6a5f7399fc5ec1a319a2c922c86fe8ccd225d4
      CANDIDATE_RELEASE_SHA: 0c15cb5c5fe6cabefa45ff37b394184faeb3e5a7
      CI: 'true'
      WS06_CAPTURE_PROFILE_SCREENSHOTS: '1'
      WS06_CAPTURE_DIRECTORY: 'docs/evidence/ws04-exact-release/profile'
    steps:
      - name: Checkout pinned WS05 exact Main release, not QA branch code
        uses: actions/checkout@v4
        with:
          ref: aa6a5f7399fc5ec1a319a2c922c86fe8ccd225d4
          persist-credentials: false
          path: exact-main
      - name: Confirm immutable expected release SHA
        working-directory: exact-main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MAIN_RELEASE_SHA"
          git diff --quiet
          echo "PASS: exact Main SHA $MAIN_RELEASE_SHA"
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Install pinned dependencies
        working-directory: exact-main
        run: npm ci --include=optional --no-audit --no-fund
      - name: Install Chromium and runtime
        working-directory: exact-main
        run: npx playwright install --with-deps chromium
      - name: Run existing exact-release visual assertions and generate screenshots
        working-directory: exact-main
        run: |
          npx playwright test --project=chromium \
            tests/browser/employee-profile-figma.spec.ts \
            tests/browser/attendance-information.spec.ts \
            tests/browser/hr-operations-leave-request-states.spec.ts \
            tests/browser/ws08-manager-attendance-report.spec.ts \
            tests/browser/manager-leave.spec.ts
      - name: Write exact-SHA evidence provenance
        if: always()
        working-directory: exact-main
        run: |
          mkdir -p docs/evidence/ws04-exact-release
          {
            echo "main_release_sha=$MAIN_RELEASE_SHA"
            echo "candidate_release_sha=$CANDIDATE_RELEASE_SHA"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "workflow_run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "utc_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "status=see_GitHub_job_conclusion_and_Playwright_report"
            echo "source=existing_synthetic_browser_tests_no_hosted_credentials"
            echo "viewport_widths=375,768,1280,1920_when_tested"
            echo "locales=EN,BN_when_tested"
            echo "figma_comparison=REQUIRES_INDEPENDENT_REVIEW_NOT_AUTOMATICALLY_PASSED"
          } > docs/evidence/ws04-exact-release/manifest.txt
          find docs/evidence -type f -name '*.png' -print0 | sort -z | xargs -0 -r sha256sum > docs/evidence/ws04-exact-release/png-sha256.txt
      - name: Upload screenshots and manifest for WS04 review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ws04-exact-main-aa6a5f73-state-screenshots
          path: |
            exact-main/docs/evidence/**/*.png
            exact-main/docs/evidence/ws04-exact-release/manifest.txt
            exact-main/docs/evidence/ws04-exact-release/png-sha256.txt
            exact-main/playwright-report
            exact-main/test-results
          if-no-files-found: error
          retention-days: 30

  exact-candidate-public-visual-evidence:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.number == 45 && github.head_ref == 'audit/hris-figma-parity-20261020')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: '1'
      CANDIDATE_RELEASE_SHA: 0c15cb5c5fe6cabefa45ff37b394184faeb3e5a7
    steps:
      - name: Checkout immutable WS05 Candidate source
        uses: actions/checkout@v4
        with:
          repository: shihab-tech04/HRIS-Candidate-v2
          ref: 0c15cb5c5fe6cabefa45ff37b394184faeb3e5a7
          persist-credentials: false
          path: exact-candidate
      - name: Verify source identity and production public-only contract
        working-directory: exact-candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_RELEASE_SHA"
          grep -Fq "VITE_CANDIDATE_PUBLIC_ONLY: 'true'" .github/workflows/release-preview.yml
          grep -Fq "VITE_ENABLE_DEMO_MODE: 'false'" .github/workflows/release-preview.yml
          grep -Fq "xfuxnljfrgvusbrpvxpa.supabase.co" .github/workflows/release-preview.yml
      - name: Install Node and locked Candidate test dependencies
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies for read-only public visual smoke
        working-directory: exact-candidate
        run: npm install --include=optional --no-audit --no-fund
      - name: Build public-only Candidate with isolated intercepted read source
        working-directory: exact-candidate
        run: |
          VITE_CANDIDATE_PUBLIC_ONLY=true \
          VITE_ENABLE_DEMO_MODE=false \
          VITE_SUPABASE_URL=http://127.0.0.1:4175 \
          VITE_SUPABASE_ANON_KEY=ci-only-placeholder \
            npx vite build --base=/HRIS-Candidate-v2/
          test -s dist/index.html
      - name: Capture exact Candidate responsive EN/BN empty/error/loading screenshots
        working-directory: exact-candidate
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --include=optional --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
          npx vite preview --base=/HRIS-Candidate-v2/ --host 127.0.0.1 --port 4175 --strictPort >"$RUNNER_TEMP/ws04-candidate-preview.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for n in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4175/HRIS-Candidate-v2/ >/dev/null; then break; fi
            sleep 1
          done
          CANDIDATE_UI_EVIDENCE_DIR=ui-evidence node scripts/candidate-public-visual-smoke.mjs
      - name: Stamp Candidate evidence provenance and hashes
        if: always()
        working-directory: exact-candidate
        run: |
          mkdir -p ui-evidence
          {
            echo "candidate_release_sha=$CANDIDATE_RELEASE_SHA"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "utc_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "source=production_public_only_source_with_isolated_intercepted_vacancy_API"
            echo "live_hosted_auth_certified=false"
            echo "figma_parity_certified=false"
          } > ui-evidence/ws04-provenance.txt
          find ui-evidence -name '*.png' -type f -print0 | sort -z | xargs -0 -r sha256sum > ui-evidence/ws04-png-sha256.txt
      - name: Upload Candidate exact-head screenshots (no deployment)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ws04-exact-candidate-0c15cb5c-public-screenshots
          path: exact-candidate/ui-evidence/
          if-no-files-found: error
          retention-days: 30
