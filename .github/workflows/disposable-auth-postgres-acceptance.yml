name: Disposable Auth, Postgres and browser acceptance (no deployment)
on:
  push:
    branches: [development/hris-checkpoints, release/hris-stable-20261017, work/ws05-free-tier-release-candidate-20261022, integration/ws02-security-proof-to-ws05-20261022, integration/ws05-main-final-review-20261022]
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Candidate branch to use for the cross-system acceptance run
        required: true
        type: choice
        options:
          - development/hris-checkpoints
          - release/candidate-stable-20261017
        default: development/hris-checkpoints

permissions:
  contents: read

concurrency:
  group: hris-disposable-acceptance-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  isolated-hris:
    if: github.ref == 'refs/heads/integration/ws05-main-final-review-20261022' || github.ref == 'refs/heads/integration/ws02-security-proof-to-ws05-20261022' || github.ref == 'refs/heads/work/ws05-free-tier-release-candidate-20261022' || github.ref == 'refs/heads/development/hris-checkpoints' || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/release/')) || (github.event_name == 'push' && github.ref == 'refs/heads/release/hris-stable-20261017')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: '1'
      HRIS_DOCKER_CONTEXT: default
      HRIS_CANDIDATE_REF: ${{ github.ref == 'refs/heads/integration/ws05-main-final-review-20261022' && 'integration/ws05-candidate-final-review-20261022' || github.ref == 'refs/heads/integration/ws02-security-proof-to-ws05-20261022' && 'integration/candidate-figma-cv-unified-20261022' || github.ref == 'refs/heads/release/hris-stable-20261017' && 'release/candidate-stable-20261017' || inputs.candidate_ref || 'development/hris-checkpoints' }}
      HRIS_SUPABASE_TEST_WORKDIR: /tmp/synesis-local-hris-test
      HRIS_SUPABASE_API_PORT: '55421'
      HRIS_SUPABASE_DB_PORT: '55422'
      SUPABASE_HOME: /tmp/synesis-supabase-home
      SUPABASE_TELEMETRY_DISABLED: '1'
      DOCKER_CONTEXT: default
    steps:
      - uses: actions/checkout@v4
      - name: Checkout trusted Candidate source for cross-repository contracts
        run: git clone --depth 1 --branch "$HRIS_CANDIDATE_REF" https://github.com/shihab-tech04/HRIS-Candidate-v2.git "$GITHUB_WORKSPACE/../HRIS-Candidate-v2"
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - name: Install repository dependencies
        run: npm install --include=optional --no-audit --no-fund
      - name: Create a fresh local-only Supabase configuration
        run: |
          set -euo pipefail
          mkdir -p "$HRIS_SUPABASE_TEST_WORKDIR"
          supabase init --workdir "$HRIS_SUPABASE_TEST_WORKDIR" --force >/dev/null
          sed -i 's/^port = 54321$/port = 55421/' "$HRIS_SUPABASE_TEST_WORKDIR/supabase/config.toml"
          sed -i 's/^port = 54322$/port = 55422/' "$HRIS_SUPABASE_TEST_WORKDIR/supabase/config.toml"
          grep -q '^project_id = "synesis-local-hris-test"$' "$HRIS_SUPABASE_TEST_WORKDIR/supabase/config.toml"
      - name: Start disposable local Auth, Postgres and Storage
        run: |
          set -euo pipefail
          if ! supabase start --workdir "$HRIS_SUPABASE_TEST_WORKDIR" --exclude studio,edge-runtime,logflare,vector,supavisor >"$RUNNER_TEMP/supabase-start.log" 2>&1; then
            echo "Supabase CLI start failed on the standard ubuntu-24.04 runner. Generated local keys and service logs are suppressed."
            docker ps --format '{{.Names}} {{.Status}}' | sed -n '/synesis-local-hris-test/p' || true
            exit 1
          fi
          echo "Disposable local Auth, Postgres and Storage are ready; generated keys were not written to logs."
      - name: TypeScript, contract and production-bundle regressions
        run: npm run check
      - name: Install Chromium for isolated browser acceptance
        run: npx playwright install --with-deps chromium
      - name: Run standalone browser regressions with synthetic sessions
        env:
          HRIS_DASHBOARD_EVIDENCE_DIR: ${{ runner.temp }}/hris-dashboard-evidence
        run: npm run test:e2e
      - name: Run real local Auth/RLS and workflow acceptance (travel, reporting, learning, timesheets)
        run: node tests/sql/isolated-auth/run-local.mjs
      - name: Run Phase 04 parity checks on the Auth-tested source migrations
        run: node tests/sql/hosted-parity/run-local.mjs
      - name: Inspect security advisories on the disposable local database
        run: supabase db advisors --local --type security --level error --fail-on none --workdir "$HRIS_SUPABASE_TEST_WORKDIR"
      - name: Stop only the disposable Supabase project
        if: always()
        run: |
          supabase stop --workdir "$HRIS_SUPABASE_TEST_WORKDIR" --no-backup >/dev/null 2>&1 || true
