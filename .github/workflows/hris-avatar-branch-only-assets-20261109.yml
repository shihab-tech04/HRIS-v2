name: HRIS avatar parity branch-only Pages asset preparation
on:
  push:
    branches:
      - fix/hris-phase1-employee-avatar-parity-20261109
    paths-ignore:
      - 'assets/**'
      - 'index.html'
      - '.nojekyll'
permissions:
  contents: write
concurrency:
  group: hris-avatar-pages-sync-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare-assets:
    if: github.repository == 'shihab-tech04/HRIS-v2' && github.ref == 'refs/heads/fix/hris-phase1-employee-avatar-parity-20261109'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout exact current Candidate contract sibling
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main https://github.com/shihab-tech04/HRIS-Candidate-v2.git "$GITHUB_WORKSPACE/../HRIS-Candidate-v2"
          expected_sha=db4163885f9609d66e9871a9c0de771fe8151d84
          git -C "$GITHUB_WORKSPACE/../HRIS-Candidate-v2" fetch --no-tags --depth=1 origin "$expected_sha"
          git -C "$GITHUB_WORKSPACE/../HRIS-Candidate-v2" checkout --detach "$expected_sha"
          test "$(git -C "$GITHUB_WORKSPACE/../HRIS-Candidate-v2" rev-parse HEAD)" = "$expected_sha"
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Install locked dependencies
        run: npm ci --include=optional --no-audit --no-fund
      - name: Build and reproduce approved Pages assets on this feature branch only
        env:
          VITE_ENABLE_PLATFORM_TENANTS: 'true'
          GITHUB_PAGES: 'true'
        run: |
          set -euo pipefail
          npm run lint
          npm run test:contracts
          npm run build
          first_digest="$(find index.html assets -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d ' ' -f1)"
          npm run build
          second_digest="$(find index.html assets -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d ' ' -f1)"
          test "$first_digest" = "$second_digest" || { echo 'Non-reproducible assets'; exit 1; }
          cmp dist/index.html index.html
          diff -qr dist/assets assets
          git diff --check
      - name: Commit only the generated Pages files to the checked feature branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/fix/hris-phase1-employee-avatar-parity-20261109'
          git add -A -- index.html assets .nojekyll
          if git diff --cached --quiet; then
            echo 'Tracked assets already match production build.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(hris): synchronize exact avatar branch Pages assets'
          git push origin HEAD:refs/heads/fix/hris-phase1-employee-avatar-parity-20261109
