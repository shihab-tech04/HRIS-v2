# Temporary integration-branch utility: commit deterministic Pages build outputs.
# Never runs on protected Main, does not deploy and does not touch SQL or secrets.
name: HRIS Tier 1 integration asset synchronization
on:
  push:
    branches:
      - integration/ws5-tier1-owners-20261118
permissions:
  contents: write
jobs:
  sync:
    if: github.repository == 'shihab-tech04/HRIS-v2' && github.ref == 'refs/heads/integration/ws5-tier1-owners-20261118'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Build exact Pages bundle with production flags
        env:
          VITE_ENABLE_PLATFORM_TENANTS: 'true'
        run: |
          set -euo pipefail
          npm ci --include=optional --no-audit --no-fund
          npm run build
      - name: Commit only built Pages assets to the integration branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/integration/ws5-tier1-owners-20261118'
          git add -A -- index.html assets
          if test -f .nojekyll; then git add .nojekyll; fi
          if git diff --cached --quiet; then
            echo 'Pages artifacts already match source'
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'build(hris-tier1): synchronize exact deterministic Pages assets'
          git push origin HEAD:refs/heads/integration/ws5-tier1-owners-20261118
