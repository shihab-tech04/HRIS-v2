name: One-time exact-main approved HRIS Pages release
on:
  push:
    branches: [release/main-approved-source-20261024]
permissions:
  contents: read
  actions: write
jobs:
  dispatch-reviewed-release:
    if: github.ref == 'refs/heads/release/main-approved-source-20261024'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Guard accepted protected main and existing release gate
        shell: bash
        env:
          EXPECTED_MAIN: '712d16254342da9cd12d1275b6826ac5c3902607'
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_MAIN"
          git cat-file -e "FETCH_HEAD:docs/programme/HRIS_360_EXECUTION_ACCEPTANCE_LEDGER_20261024.json"
          git cat-file -e "FETCH_HEAD:supabase/staging/hosted-membership-transition/20261024_super_admin_membership_rebind.staging.sql"
          git show "FETCH_HEAD:.github/workflows/deploy-pages.yml" | grep -F "github.ref == 'refs/heads/main' && inputs.release_approved == true"
      - name: Dispatch the existing protected main-only approved GitHub Pages workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api -X POST \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GH_REPO/actions/workflows/deploy-pages.yml/dispatches" \
            --input - <<'JSON'
          {"ref":"main","inputs":{"release_approved":true}}
          JSON
          echo "Dispatched existing reviewed Main HRIS workflow; publishing is conditional on its CI, browser and live asset gates."
