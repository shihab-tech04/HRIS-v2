name: Phase 2A tenant provisioning Auth, RLS and browser acceptance
on:
  push:
    branches: [development/hris-checkpoints, release/hris-stable-20261017]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase2a-auth-browser-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  tenant-provisioning:
    if: github.ref == 'refs/heads/development/hris-checkpoints' || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/release/')) || (github.event_name == 'push' && github.ref == 'refs/heads/release/hris-stable-20261017')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: '1'
      DOCKER_CONTEXT: default
      HRIS_DOCKER_CONTEXT: default
      HRIS_PHASE2A_TEST_WORKDIR: /tmp/synesis-hris-phase2a-ci
      HRIS_PHASE2A_PROJECT_ID: synesis-hris-phase2a-ci
      HRIS_PHASE2A_API_PORT: '58321'
      HRIS_PHASE2A_DB_PORT: '58322'
      SUPABASE_HOME: /tmp/synesis-phase2a-supabase-home
      SUPABASE_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - name: Install repository dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium for the real browser journey
        run: npx playwright install --with-deps chromium
      - name: Create a fresh disposable Supabase configuration
        run: |
          set -euo pipefail
          mkdir -p "$HRIS_PHASE2A_TEST_WORKDIR"
          supabase init --workdir "$HRIS_PHASE2A_TEST_WORKDIR" --force >/dev/null
          sed -i 's/^project_id = .*/project_id = "synesis-hris-phase2a-ci"/' "$HRIS_PHASE2A_TEST_WORKDIR/supabase/config.toml"
          sed -i 's/^port = 54321$/port = 58321/; s/^port = 54322$/port = 58322/' "$HRIS_PHASE2A_TEST_WORKDIR/supabase/config.toml"
          grep -q '^project_id = "synesis-hris-phase2a-ci"$' "$HRIS_PHASE2A_TEST_WORKDIR/supabase/config.toml"
      - name: Start only the disposable Auth and Postgres stack
        run: |
          set -euo pipefail
          if ! supabase start --workdir "$HRIS_PHASE2A_TEST_WORKDIR" --exclude studio,edge-runtime,logflare,vector,supavisor >"$RUNNER_TEMP/phase2a-supabase-start.log" 2>&1; then
            echo "Local Supabase startup failed on the standard ubuntu-24.04 runner. Generated keys and service logs are suppressed."
            docker ps --format '{{.Names}} {{.Status}}' | grep 'synesis-hris-phase2a-ci' || true
            exit 1
          fi
          echo "Fresh disposable Auth and PostgreSQL services are ready; generated keys were not printed."
      - name: Run Phase 2A/2B Auth, RLS, and database contracts
        run: node tests/sql/phase2a/run-local.mjs
      - name: Stop only this disposable Supabase project
        if: always()
        run: supabase stop --workdir "$HRIS_PHASE2A_TEST_WORKDIR" --no-backup >/dev/null 2>&1 || true
