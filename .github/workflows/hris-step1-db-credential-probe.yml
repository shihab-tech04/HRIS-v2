# Read-only first gate for HRIS database backup/recovery.
# Only manually triggered from trusted, protected main. No PR/push trigger and no code checkout.
# Never prints the database password, exports data, runs migrations or modifies hosted SQL.
name: "HRIS Step 1 - PostgreSQL credential probe"
on:
  workflow_dispatch:
    inputs:
      session_pooler_host:
        description: "HOST only: Supabase HRIS 360 > Connect > Session pooler (no password/URI)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hris-recovery-credential-probe
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.repository == 'shihab-tech04/HRIS-v2' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Connect with encrypted session, execute a read-only PG17 probe
        shell: bash
        env:
          HRIS_POOLER_HOST: ${{ inputs.session_pooler_host }}
          PGPASSWORD: ${{ secrets.HRIS_DB_PASSWORD }}
          PGOPTIONS: "-c default_transaction_read_only=on"
        run: |
          set -euo pipefail
          if [[ -z "${PGPASSWORD:-}" ]]; then
            echo "::error::Missing GitHub Actions secret HRIS_DB_PASSWORD"
            exit 1
          fi
          # Project location observed from the connected Supabase project API.
          # Pooler cluster index is provider-specific; copy actual HOST from Connect.
          if [[ ! "${HRIS_POOLER_HOST}" =~ ^aws-[0-9]+-ap-northeast-2\.pooler\.supabase\.com$ ]]; then
            echo "::error::Use the exact HRIS Connect > Session pooler host for ap-northeast-2 (host only)."
            exit 1
          fi
          # Docker is present on GitHub-hosted Ubuntu runners. Client matches PG17.
          # PGPASSWORD is inherited into the container by NAME, not echoed in args/logs.
          docker run --rm \
            --env PGPASSWORD --env PGOPTIONS \
            postgres:17-alpine \
            psql "host=${HRIS_POOLER_HOST} port=5432 dbname=postgres user=postgres.xfuxnljfrgvusbrpvxpa sslmode=require connect_timeout=15 application_name=hris_recovery_probe" \
              -X -qAt -v ON_ERROR_STOP=1 \
              -c "SELECT CASE WHEN current_setting('server_version_num')::integer / 10000 = 17 THEN 'PG17_CONNECTION_VERIFIED' ELSE 'WRONG_PG_VERSION' END" \
            | grep -Fx "PG17_CONNECTION_VERIFIED"
          echo "Read-only connection verified. No backup has been made yet."
