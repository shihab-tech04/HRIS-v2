name: Integrated HRIS offline frontend review (no deploy)
on:
  push:
    branches: [integration/hris-frontend-review-20261022]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - run: npm install --include=optional --no-audit --no-fund
      - name: Frontend isolation contracts and TypeScript
        run: node --test tests/contracts/frontend-review-isolation.test.mjs && npm run lint
      - name: Build actual integrated UI using offline fixtures only
        run: npm run build:frontend-review
      - name: Verify compiled review cannot reach hosted Supabase
        run: |
          test -s dist/app.html
          if grep -R -F 'oslgwxaqfbteqtwqvdzs.supabase.co' dist/assets; then
            echo 'Production project URL reached offline bundle' >&2
            exit 1
          fi
      - name: Chromium offline Manager/Employee navigation
        run: |
          npx playwright install --with-deps chromium
          npx vite preview --host 127.0.0.1 --port 4175 --strictPort >"$RUNNER_TEMP/offline-review.log" 2>&1 &
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          const browser = await chromium.launch();
          try {
            const page = await browser.newPage({ viewport: { width: 1280, height: 800 } });
            const supabaseRequests = [];
            const jsErrors = [];
            page.on('request', request => { if (request.url().includes('supabase.co')) supabaseRequests.push(request.url()); });
            page.on('pageerror', error => jsErrors.push(error.message));
            await page.goto('http://127.0.0.1:4175/HRIS-v2/app.html', { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.locator('[data-frontend-review="offline"]').waitFor({ state: 'visible', timeout: 20000 }).catch(async error => {
              console.error('Offline preview DOM:', (await page.content()).slice(0, 1300));
              console.error('Browser errors:', jsErrors);
              throw error;
            });
            await page.getByRole('button', { name: 'Employee view' }).click();
            await page.getByRole('button', { name: 'Manager view' }).click();
            if (supabaseRequests.length) throw new Error('Production Supabase request emitted in offline review');
            if (jsErrors.length) throw new Error('Review runtime crashed: ' + jsErrors.join('; '));
            await page.getByText('Team Members').first().waitFor({ state: 'visible' });
            if (await page.getByText('Unable to load the authorized dashboard.').count()) {
              throw new Error('Offline dashboard showed an API error instead of synthetic fixtures');
            }
            await page.screenshot({ path: 'hris-offline-manager-1280.png', fullPage: true });
            await page.setViewportSize({ width: 1920, height: 1080 });
            await page.screenshot({ path: 'hris-offline-manager-1920.png', fullPage: true });
            // Verify the two other approved Main Figma routes in the same isolated shell.
            await page.setViewportSize({ width: 1280, height: 800 });
            await page.locator('aside[aria-label="Primary HRIS navigation"]')
              .getByRole('button', { name: /Attendance & Leave/ }).click();
            const leaveNav = page.getByRole('navigation', { name: 'Attendance and leave sections' });
            await leaveNav.getByRole('button', { name: 'Attendance Information' }).waitFor();
            await page.getByText('Review Employee A', { exact: true }).first().waitFor({ state: 'visible', timeout: 12000 });
            if (await page.getByText('Attendance service returned an invalid response.').count())
              throw new Error('Offline Attendance fixture has invalid RPC shape');
            await page.screenshot({ path: 'hris-offline-attendance-information-1280.png', fullPage: true });
            await page.setViewportSize({ width: 1920, height: 1080 });
            await page.screenshot({ path: 'hris-offline-attendance-information-1920.png', fullPage: true });
            await page.setViewportSize({ width: 1280, height: 800 });
            await leaveNav.getByRole('button', { name: 'Attendance Requests' }).click();
            const attendanceQueue = page.getByRole('region', { name: 'Attendance correction request results' });
            await attendanceQueue.waitFor({ state: 'visible', timeout: 12000 });
            const correctionTable = attendanceQueue.getByRole('table');
            const approvedAttendanceHeaders = ['Name', 'Date', 'In Time', 'Out Time', 'Applying Date', 'Remarks', 'Action'];
            for (const column of approvedAttendanceHeaders) {
              if (await correctionTable.getByRole('columnheader', { name: column, exact: true }).count() !== 1)
                throw new Error('Figma Attendance Requests column absent or duplicated: ' + column);
            }
            const correctionRows = correctionTable.getByRole('row').filter({ hasText: /Review Employee/ });
            if (await correctionRows.count() !== 8) throw new Error('Offline Attendance queue fixture must show eight pending synthetic rows');
            const firstCorrection = correctionTable.getByRole('row').filter({ hasText: 'Review Employee A' });
            if (!await firstCorrection.getByText('Forgot to punch').count())
              throw new Error('Attendance Remarks must bind to existing correction reason');
            if (!await firstCorrection.getByRole('button', { name: 'Approve' }).count() ||
                !await firstCorrection.getByRole('button', { name: 'Reject' }).count())
              throw new Error('Attendance decisions missing or not permission-gated');
            await page.screenshot({ path: 'hris-offline-attendance-requests-1280.png', fullPage: true });
            await page.setViewportSize({ width: 1920, height: 1080 });
            await page.screenshot({ path: 'hris-offline-attendance-requests-1920.png', fullPage: true });
            await page.setViewportSize({ width: 375, height: 812 });
            if (await page.evaluate(() => document.documentElement.scrollWidth) > 375)
              throw new Error('Attendance correction route causes 375px document overflow');
            await attendanceQueue.focus();
            await page.keyboard.press('ArrowRight');
            await page.waitForTimeout(250);
            const queueScroll = await attendanceQueue.evaluate(el => el.scrollLeft);
            if (queueScroll <= 0) throw new Error('Attendance Requests table is not keyboard scrollable at 375px');
            await attendanceQueue.evaluate(el => { el.scrollLeft = el.scrollWidth; });
            const attendanceAction = await firstCorrection.getByRole('button', { name: 'Approve' }).boundingBox();
            const queueBox = await attendanceQueue.boundingBox();
            if (!attendanceAction || !queueBox || attendanceAction.x < queueBox.x - 1 ||
              attendanceAction.x + attendanceAction.width > queueBox.x + queueBox.width + 2)
              throw new Error('Attendance approval action clipped at full horizontal scroll');
            await firstCorrection.getByRole('button', { name: 'Reject' }).click();
            await page.getByRole('dialog', { name: 'Reject attendance correction' }).waitFor();
            await page.getByRole('button', { name: 'Cancel', exact: true }).click();
            if (await page.getByRole('dialog', { name: 'Reject attendance correction' }).count())
              throw new Error('Attendance rejection dialog did not close on Cancel');
            await attendanceQueue.evaluate(el => { el.scrollLeft = 0; });
            await page.screenshot({ path: 'hris-offline-attendance-requests-375.png', fullPage: true });
            await page.getByRole('button', { name: 'Switch language to Bengali' }).click();
            await page.screenshot({ path: 'hris-offline-attendance-requests-bn-375.png', fullPage: true });
            await page.getByRole('button', { name: 'Switch language to English' }).click();
            await page.setViewportSize({ width: 1280, height: 800 });
            await leaveNav.getByRole('button', { name: 'Leave Requests' }).click();
            await leaveNav.getByRole('button', { name: 'Leave Requests' }).getAttribute('aria-current').then(
              value => { if (value !== 'page') throw new Error('Leave Requests navigation is not selected'); }
            );
            await page.getByText('Review Employee A', { exact: true }).first().waitFor({ state: 'visible', timeout: 12000 });
            for (const name of ['Name', 'Applicable From', 'Applicable To', 'Leave Type', 'Applying Date', 'Remarks', 'Action']) {
              const count = await page.getByRole('table', { name: 'Leave requests' })
                .getByRole('columnheader', { name, exact: true }).count();
              if (count !== 1) throw new Error('Approved Figma Leave Requests column absent: ' + name);
            }
            const reviewRow = page.getByRole('table', { name: 'Leave requests' }).getByRole('row')
              .filter({ hasText: 'Review Employee A' });
            if (!await reviewRow.getByText('2026-10-21').count())
              throw new Error('Applying Date must bind to leave_requests.submitted_at');
            if (!await reviewRow.getByText('Review-only fixture').count())
              throw new Error('Remarks must bind to leave_requests.reason');
            if (!await reviewRow.getByRole('button', { name: 'Approve' }).count()
              || !await reviewRow.getByRole('button', { name: 'Reject' }).count())
              throw new Error('Approved decisions are not accessible via Figma action column');
            // Match approved Figma and shared HR Operations: small solid circles within accessible touch targets.
            for (const [action, expected] of [['Approve', 'rgb(0, 135, 77)'], ['Reject', 'rgb(255, 0, 0)']]) {
              const target = reviewRow.getByRole('button', { name: action, exact: true });
              const detail = await target.evaluate(el => {
                const circle = el.querySelector('span');
                return { color: circle ? getComputedStyle(circle).backgroundColor : '',
                  width: circle?.getBoundingClientRect().width ?? 0,
                  touchTarget: el.getBoundingClientRect().width };
              });
              if (detail.color !== expected || Math.abs(detail.width - 24) > 1 || detail.touchTarget < 40)
                throw new Error('Figma leave decision circle regression: ' + action + ' ' + JSON.stringify(detail));
            }
            await reviewRow.getByRole('button', { name: 'Reject' }).click();
            await page.getByRole('dialog', { name: 'Reject leave request' }).waitFor({ state: 'visible' });
            await page.getByRole('button', { name: 'Cancel', exact: true }).click();
            if (await page.getByRole('dialog', { name: 'Reject leave request' }).count())
              throw new Error('Leave rejection dialog did not close on Cancel');
            if (await page.getByText('Leave service returned an invalid response.').count())
              throw new Error('Offline Leave fixture has invalid RPC shape');
            const leaveResults = page.getByRole('region', { name: 'Leave request results' });
            await leaveResults.waitFor({ state: 'visible' });
            await page.getByRole('searchbox', { name: 'Search requests' }).waitFor({ state: 'visible' });
            if (await page.getByText('Pending requests', { exact: true }).count())
              throw new Error('Leave Requests still displays expanded overview cards by default');
            await page.getByRole('button', { name: 'Filters', exact: true }).click();
            await page.getByLabel('From date', { exact: true }).waitFor({ state: 'visible' });
            await page.getByRole('button', { name: 'Filters', exact: true }).click();
            if (await page.getByLabel('From date', { exact: true }).count())
              throw new Error('Advanced filters remain expanded on the compact request screen');
            await page.getByRole('button', { name: 'More options', exact: true }).click();
            await page.getByRole('navigation', { name: 'Leave management sections' }).getByRole('button', { name: 'Request overview' }).click();
            await page.getByText('Pending requests', { exact: true }).waitFor({ state: 'visible' });
            await page.getByRole('navigation', { name: 'Leave management sections' }).getByRole('button', { name: 'Request overview' }).click();
            if (await page.getByText('Pending requests', { exact: true }).count())
              throw new Error('Overview cannot be collapsed after inspection');
            if (await page.getByRole('heading', { name: 'Absence calendar' }).count())
              throw new Error('Default Leave Requests route still expands the calendar below the table');
            if (await page.getByRole('heading', { name: 'Leave policy' }).count())
              throw new Error('Default Leave Requests route still expands policy management below the table');
            await page.getByRole('navigation', { name: 'Leave management sections' })
              .getByRole('button', { name: 'Absence calendar' }).click();
            await page.locator('#leave-absence-calendar-heading').waitFor({ state: 'visible' });
            await page.getByRole('button', { name: 'Leave Requests', exact: true }).last().click();
            await leaveResults.waitFor({ state: 'visible' });
            if (await page.getByRole('heading', { name: 'Absence calendar' }).count())
              throw new Error('Calendar remains expanded after returning to Leave Requests');
            await page.getByRole('navigation', { name: 'Leave management sections' })
              .getByRole('button', { name: 'Leave policy' }).click();
            await page.getByRole('heading', { name: 'Leave type policies', exact: true }).waitFor({ state: 'visible' });
            await page.getByRole('button', { name: 'Leave Requests', exact: true }).last().click();
            await leaveResults.waitFor({ state: 'visible' });
            // Figma screenshots must capture the default state, not expanded test-only menus.
            await page.getByRole('button', { name: 'More options', exact: true }).click();
            if (await page.getByRole('navigation', { name: 'Leave management sections' }).count())
              throw new Error('Leave management options remain visible in default Figma screenshot');
            await page.screenshot({ path: 'hris-offline-leave-requests-1280.png', fullPage: true });
            await page.setViewportSize({ width: 1920, height: 1080 });
            await page.screenshot({ path: 'hris-offline-leave-requests-1920.png', fullPage: true });
            await page.setViewportSize({ width: 375, height: 812 });
            const pageWidth = await page.evaluate(() => document.documentElement.scrollWidth);
            if (pageWidth > 375) throw new Error('Leave route causes document overflow at 375px: ' + pageWidth);
            await leaveResults.focus();
            await page.keyboard.press('ArrowRight');
            await page.waitForTimeout(300);
            const scrollerProgress = await leaveResults.evaluate(el => el.scrollLeft);
            if (scrollerProgress <= 0) throw new Error('Leave table cannot scroll by keyboard at 375px');
            await leaveResults.evaluate(el => { el.scrollLeft = el.scrollWidth; });
            const approve = await leaveResults.getByRole('button', { name: 'Approve' }).first().boundingBox();
            const leaveRegion = await leaveResults.boundingBox();
            if (!approve || !leaveRegion || approve.x < leaveRegion.x - 1 || approve.x + approve.width > leaveRegion.x + leaveRegion.width + 2)
              throw new Error('Leave decision action remains clipped after horizontal scroll');
            await leaveResults.evaluate(el => { el.scrollLeft = 0; });
            await page.evaluate(() => window.scrollTo(0, 0));
            await page.screenshot({ path: 'hris-offline-leave-requests-375.png', fullPage: true });
            await page.getByRole('button', { name: 'Switch language to Bengali' }).click();
            await page.screenshot({ path: 'hris-offline-leave-requests-bn-375.png', fullPage: true });
            await page.getByRole('button', { name: 'Switch language to English' }).click();
            await page.setViewportSize({ width: 1280, height: 800 });
            await page.locator('aside[aria-label="Primary HRIS navigation"]')
              .getByRole('button', { name: 'Dashboard' }).click();
            await page.getByRole('heading', { name: 'Managerial Dashboard' }).first().waitFor();
            await page.setViewportSize({ width: 375, height: 812 });
            const tabs = page.getByRole('navigation', { name: 'Dashboard views' });
            await tabs.waitFor({ state: 'visible' });
            for (const button of await tabs.locator('button').all()) {
              const box = await button.boundingBox();
              if (!box || box.x < -1 || box.x + box.width > 376)
                throw new Error('Mobile dashboard tab remains clipped');
            }
            const teamScroller = page.getByRole('region', { name: 'Scrollable team report totals' });
            await teamScroller.waitFor({ state: 'visible' });
            const before = await teamScroller.evaluate(el => ({
              width: el.clientWidth, total: el.scrollWidth, position: el.scrollLeft,
            }));
            if (before.total <= before.width + 120) throw new Error('Team table lost expected horizontal reachability');
            await teamScroller.focus();
            await page.keyboard.press('ArrowRight');
            await page.waitForTimeout(300);
            const keyboardScroll = await teamScroller.evaluate(el => el.scrollLeft);
            if (keyboardScroll <= before.position) throw new Error('Keyboard cannot scroll mobile team table horizontally');
            await teamScroller.evaluate(el => { el.scrollLeft = el.scrollWidth; });
            const lastColumn = teamScroller.getByRole('button', { name: /View attendance details for/ }).first();
            const action = await lastColumn.boundingBox();
            const region = await teamScroller.boundingBox();
            if (!action || !region || action.x + action.width > region.x + region.width + 2
                || action.x < region.x - 1) throw new Error('Last team decision/detail action is unreachable');
            await teamScroller.evaluate(el => { el.scrollLeft = 0; });
            await page.evaluate(() => window.scrollTo({ top: 0, left: 0, behavior: 'instant' }));
            await page.waitForTimeout(150);
            await page.screenshot({ path: 'hris-offline-manager-375.png', fullPage: true });
            await page.getByRole('button', { name: 'Switch language to Bengali' }).click();
            for (const button of await page.getByRole('navigation', { name: /Dashboard views|ড্যাশবোর্ড/ }).locator('button').all()) {
              const box = await button.boundingBox();
              if (!box || box.x < -1 || box.x + box.width > 376)
                throw new Error('Bengali dashboard tab clipped at mobile width');
            }
            if (await page.getByText('Present, absent, and late counts use explicit attendance statuses.', { exact: false }).count())
              throw new Error('Dashboard attendance explanation was not translated in Bengali');
            await page.screenshot({ path: 'hris-offline-manager-bn-375.png', fullPage: true });
            await page.getByRole('button', { name: 'Switch language to English' }).click();
            await page.getByRole('button', { name: 'Employee view' }).click();
            await page.getByRole('heading', { name: 'Review Employee' }).waitFor({ state: 'visible', timeout: 12000 });
            await page.waitForTimeout(300);
            for (const errorText of [
              'Unable to load your assigned work.',
              'Unable to load upcoming training.',
              'Unable to load your upcoming reviews.',
              'Unable to load your pending requests.',
            ]) {
              if (await page.getByText(errorText, { exact: false }).count())
                throw new Error('Employee review widget showed a fixture error: ' + errorText);
            }
            if (await page.getByText('Employee services returned an invalid response.').count())
              throw new Error('Offline Employee fixture violated expected dashboard RPC contract');
            await page.screenshot({ path: 'hris-offline-employee-375.png', fullPage: true });
            if (supabaseRequests.length) throw new Error('Offline review connected to production Supabase');
          } finally { await browser.close(); }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hris-offline-review-build-and-screenshot
          path: |
            dist/
            hris-offline-*.png
          if-no-files-found: ignore
          retention-days: 7
