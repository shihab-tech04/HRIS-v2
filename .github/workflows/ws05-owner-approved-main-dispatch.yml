name: WS05 one-shot user-approved HRIS Main release dispatch
on:
  push:
    branches: [release/ws05-owner-approved-main-0bd82d-20261031]
    paths:
      - .github/workflows/ws05-owner-approved-main-dispatch.yml
permissions:
  actions: write
  contents: read
jobs:
  authorized-dispatch:
    if: >-
      github.ref == 'refs/heads/release/ws05-owner-approved-main-0bd82d-20261031' &&
      github.event.head_commit.message == 'chore(release): one-shot owner-approved HRIS Main workflow dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch existing protected Main Pages workflow at exact Main
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const expected = '0bd82d4e1445d326ca84778c62ee5fab44c581d9';
            const branch = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            if (branch.data.commit.sha !== expected || branch.data.protected !== true) {
              core.setFailed('Main changed or is unprotected; refusing stale production dispatch.');
              return;
            }
            // User explicitly authorized production release in ChatGPT on 2026-10-31.
            // Source: merged PR #157, exact-head build/browser + Auth/Postgres PASS.
            // Independent off-GitHub Drive backup SHA256:
            // 19c3a65b4b4cafc9b06aa501a15faa29a309b03ffbfbec4dcd5f646086293a2e
            // Drive: https://drive.google.com/file/d/1vNqImApIhEvLUoGVeMyFnduVxOqyc5Mj/view?usp=drivesdk
            // Invoke unchanged approved production workflow; do not bypass its gates.
            const prior = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'deploy-pages.yml', branch: 'main', per_page: 8,
            });
            if (prior.data.workflow_runs.some(run => run.head_sha === expected && ['queued','in_progress','waiting'].includes(run.status))) {
              core.notice('Exact source already deploying; refusing duplicate.');
              return;
            }
            await github.rest.actions.createWorkflowDispatch({
              owner, repo, workflow_id: 'deploy-pages.yml', ref: 'main',
              inputs: { release_approved: 'true' },
            });
            core.notice('Existing HRIS Main protected production release dispatched at ' + expected);
