name: HRIS employee address privacy checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/20261016150216_employee_get_my_addresses.sql'
      - 'tests/sql/employee-addresses/**'
      - '.github/workflows/employee-addresses-postgres.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20261016150216_employee_get_my_addresses.sql'
      - 'tests/sql/employee-addresses/**'
      - '.github/workflows/employee-addresses-postgres.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  employee-addresses-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      database:
        image: postgres:17
        env:
          POSTGRES_DB: hris_employee_addresses
          POSTGRES_USER: test_runner
          POSTGRES_PASSWORD: synthetic_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_runner -d hris_employee_addresses"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Verify address row isolation and function grants
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: test_runner
          PGPASSWORD: synthetic_test_only
          PGDATABASE: hris_employee_addresses
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/employee-addresses/fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261016150216_employee_get_my_addresses.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/employee-addresses/verify.sql
          echo "Passed against synthetic PostgreSQL 17; this is not production Auth/RLS certification."
