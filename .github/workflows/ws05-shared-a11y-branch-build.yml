name: WS05 shared accessibility branch-only Pages asset parity
on:
  push:
    branches: [integration/ws05-shared-accessibility-140-148-150-20261031]
    paths:
      - .github/workflows/ws05-shared-a11y-branch-build.yml
permissions:
  contents: write
concurrency:
  group: ws05-shared-a11y-branch-only
  cancel-in-progress: false
jobs:
  deterministic-branch-build:
    if: github.ref == 'refs/heads/integration/ws05-shared-accessibility-140-148-150-20261031'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Install current locked source dependencies
        run: npm install --include=optional --no-audit --no-fund
      - name: Check out pinned deployed Candidate for cross-repository contract tests
        shell: bash
        run: |
          set -euo pipefail
          expected_sha=39d07585c854709f5c16b2712a6634da386c5c4d
          git clone --quiet --depth 1 --branch main https://github.com/shihab-tech04/HRIS-Candidate-v2.git "$GITHUB_WORKSPACE/../HRIS-Candidate-v2"
          git -C "$GITHUB_WORKSPACE/../HRIS-Candidate-v2" fetch --quiet --no-tags --depth=1 origin "$expected_sha"
          git -C "$GITHUB_WORKSPACE/../HRIS-Candidate-v2" checkout --quiet --detach "$expected_sha"
          test "$(git -C "$GITHUB_WORKSPACE/../HRIS-Candidate-v2" rev-parse HEAD)" = "$expected_sha"
      - name: Static TypeScript and contract gate before committing
        run: npm run lint && npm run test:contracts
      - name: Rebuild only existing GitHub Pages assets (not production deployment)
        env:
          VITE_ENABLE_PLATFORM_TENANTS: 'true'
          GITHUB_PAGES: 'true'
        run: npm run build
      - name: Assert source-only scope and commit exact branch Pages parity
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- index.html assets .nojekyll
          git diff --cached --name-only | grep -Eq '^(index[.]html$|assets/|[.]nojekyll$)'
          if git diff --cached --quiet; then
            echo 'No Pages assets changed; source already synchronized'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build(ws05): synchronize shared accessibility branch Pages assets'
            git push origin HEAD:refs/heads/integration/ws05-shared-accessibility-140-148-150-20261031
          fi
