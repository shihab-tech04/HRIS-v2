name: HRIS employee family privacy checks
on:
  pull_request:
    branches: [main, 'release/hris-stable-20261017', 'work/ws02-production-view-security-20261021']
    paths:
      - 'supabase/migrations/20261016171104_employee_family_tenant_scoped_read.sql'
      - 'tests/sql/employee-family/**'
      - '.github/workflows/employee-family-postgres.yml'
  push:
    branches: [main, 'release/hris-stable-20261017', 'work/ws02-production-view-security-20261021']
    paths:
      - 'supabase/migrations/20261016171104_employee_family_tenant_scoped_read.sql'
      - 'tests/sql/employee-family/**'
      - '.github/workflows/employee-family-postgres.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  employee-family-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      database:
        image: postgres:17
        env:
          POSTGRES_DB: hris_employee_family
          POSTGRES_USER: test_runner
          POSTGRES_PASSWORD: synthetic_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_runner -d hris_employee_family"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Verify employee family isolation in synthetic PostgreSQL
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: test_runner
          PGPASSWORD: synthetic_test_only
          PGDATABASE: hris_employee_family
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/employee-family/fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261016171104_employee_family_tenant_scoped_read.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/employee-family/verify.sql
          echo "Passed against synthetic PostgreSQL 17; this is not production Auth/RLS certification."
