name: WS07 HR03 temporary branch-only organization acceptance and Pages parity
on:
  push:
    branches:
      - work/ws07-hr03-master-persistence-20261031
    paths-ignore:
      - 'assets/**'
      - 'index.html'
      - '.nojekyll'
permissions:
  contents: write
concurrency:
  group: ws07-hr03-source-assets-${{ github.ref }}
  cancel-in-progress: false
jobs:
  isolated-hr03:
    if: github.repository == 'shihab-tech04/HRIS-v2' && github.ref == 'refs/heads/work/ws07-hr03-master-persistence-20261031'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Exact deployed Candidate contract fixture
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main https://github.com/shihab-tech04/HRIS-Candidate-v2.git "$GITHUB_WORKSPACE/../HRIS-Candidate-v2"
          expected='39d07585c854709f5c16b2712a6634da386c5c4d'
          git -C "$GITHUB_WORKSPACE/../HRIS-Candidate-v2" fetch --no-tags --depth=1 origin "$expected"
          git -C "$GITHUB_WORKSPACE/../HRIS-Candidate-v2" checkout --detach "$expected"
          test "$(git -C "$GITHUB_WORKSPACE/../HRIS-Candidate-v2" rev-parse HEAD)" = "$expected"
      - name: TypeScript, complete contracts, and production compilation
        env:
          VITE_ENABLE_PLATFORM_TENANTS: 'true'
        run: |
          npm install --include=optional --no-audit --no-fund
          npm run lint
          npm run test:contracts
          npm run build
      - name: Repeat build and require identical committed output
        env:
          VITE_ENABLE_PLATFORM_TENANTS: 'true'
        run: |
          set -euo pipefail
          first="$(find index.html assets -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d ' ' -f1)"
          npm run build
          second="$(find index.html assets -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d ' ' -f1)"
          test "$first" = "$second"
          cmp dist/index.html index.html
          diff -qr dist/assets assets
          git diff --check
      - name: Commit only generated files to this isolated feature branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/work/ws07-hr03-master-persistence-20261031'
          git add -A -- index.html assets .nojekyll
          if git diff --cached --quiet; then
            echo 'Exact Pages source already committed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'WS07 HR03: synchronize deterministic Pages assets'
          git push origin "HEAD:$GITHUB_REF"
