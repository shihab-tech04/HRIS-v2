# WS05: owner-approved, exact four-migration release. No automatic hosted SQL writes.
# Requires separately approved Employee Profile merge and a verified recovery point.
name: WS05 Employee Profile and workforce SQL production release
on:
  workflow_dispatch:
    inputs:
      release_approved:
        description: Owner approves four exact Employee Profile and workforce-account migrations
        type: boolean
        required: true
        default: false
      offsite_recovery_verified:
        description: Owner independently verified current encrypted DB/source Drive copies and isolated restore
        type: boolean
        required: true
        default: false
      backup_run_id:
        description: Exact-Main successful encrypted database export run ID (unexpired)
        type: string
        required: true
      restore_run_id:
        description: Exact-Main successful isolated PG17 restore run ID
        type: string
        required: true
      session_pooler_host:
        description: Replacement HRIS Supabase session-pooler HOST only (not a URL)
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: hris-profile-sql-production
  cancel-in-progress: false
jobs:
  apply-four-reviewed:
    if: "${{ github.repository == 'shihab-tech04/HRIS-v2' && github.ref == 'refs/heads/main' && inputs.release_approved == true && inputs.offsite_recovery_verified == true }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PGHOST: ${{ inputs.session_pooler_host }}
      PGPORT: '5432'
      PGDATABASE: postgres
      PGUSER: postgres.xfuxnljfrgvusbrpvxpa
      PGSSLMODE: require
      PGPASSWORD: ${{ secrets.HRIS_DB_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
      BACKUP_RUN_ID: ${{ inputs.backup_run_id }}
      RESTORE_RUN_ID: ${{ inputs.restore_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - name: Verify exact recovered Main and apply four pinned migrations only
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          # The existing protected release and independent approval gates must remain intact.
          test -n "$PGPASSWORD"
          [[ "$PGHOST" =~ ^aws-[0-9]+-ap-northeast-2\.pooler\.supabase\.com$ ]] || {
            echo '::error::Invalid replacement HRIS pooler host'; exit 1;
          }
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_REPOSITORY" = 'shihab-tech04/HRIS-v2'
          test -s supabase/migrations/20261027040642_employee_profile_tenant_scoped_contract.sql
          test -s supabase/migrations/20261030114500_employee_profile_certificate_policy_guards.sql
          test -s supabase/migrations/20261105093000_hris_scoped_user_finalization.sql
          test -s supabase/migrations/20261106090000_hris_new_workforce_account.sql
          # Pin all four SQL file bytes to the exact reviewed PR #159 and #177 sources.
          test "$(sha256sum supabase/migrations/20261027040642_employee_profile_tenant_scoped_contract.sql | cut -d ' ' -f1)" = '7b156e3f33e4688d3861eb09c3c660243ce2ead667c0c83220330649698c7a39' || {
            echo '::error::Profile tenant migration bytes differ from signed release plan'; exit 1;
          }
          test "$(sha256sum supabase/migrations/20261030114500_employee_profile_certificate_policy_guards.sql | cut -d ' ' -f1)" = 'a5b3d96bdb628f5843d9f0efb01a452a9324eb2271030fa193f695204f0f60c5' || {
            echo '::error::Profile certificate policy bytes differ from signed release plan'; exit 1;
          }

          test "$(sha256sum supabase/migrations/20261105093000_hris_scoped_user_finalization.sql | cut -d ' ' -f1)" = '2d1d82fb29dc06fd6d58099d6d2a8a6af6ddd8a4b71b830c435cc5adc76a0e31' || {
            echo '::error::Account finalization migration differs from reviewed source'; exit 1;
          }
          test "$(sha256sum supabase/migrations/20261106090000_hris_new_workforce_account.sql | cut -d ' ' -f1)" = 'a439bc131d733784ac9a86cf04eaf7d6d6ed6e13222ee6403fdabf73fb5a9d20' || {
            echo '::error::New workforce migration differs from reviewed source'; exit 1;
          }

          # Require current replacement DB export, verified isolated recovery,
          # exact fresh SQL rehearsal and source CI evidence. Exact final PR-head
          # and protected Main SHA gates are independently checked below.
          python3 - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timezone, timedelta
          def read_github(path):
              req = urllib.request.Request(
                  'https://api.github.com/repos/shihab-tech04/HRIS-v2/' + path,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json',
                           'User-Agent': 'HRIS-WS05-exact-recovery'})
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.load(response)

          protected_sha = os.environ['GITHUB_SHA']
          backup_id, restore_id = os.environ['BACKUP_RUN_ID'], os.environ['RESTORE_RUN_ID']
          if not backup_id.isdecimal() or not restore_id.isdecimal():
              raise SystemExit('Exact numeric backup and restore run IDs are required')
          backup, restored = read_github('actions/runs/' + backup_id), read_github('actions/runs/' + restore_id)
          for run, title in ((backup, 'HRIS Step 1 - Encrypted database export'),
                             (restored, 'HRIS Step 1 - Isolated PostgreSQL restore proof')):
              if (run.get('name') != title or run.get('status') != 'completed'
                  or run.get('conclusion') != 'success'
                  or run.get('event') != 'workflow_dispatch'
                  or run.get('head_branch') != 'main'
                  or run.get('head_sha') != protected_sha):
                  raise SystemExit('Exact protected-Main recovery run mismatch: ' + title)
          backup_time = datetime.fromisoformat(backup['created_at'].replace('Z','+00:00'))
          restored_time = datetime.fromisoformat(restored['created_at'].replace('Z','+00:00'))
          if (backup_time > restored_time or datetime.now(timezone.utc)-backup_time > timedelta(hours=23)):
              raise SystemExit('Recovery evidence is stale or out of sequence; refresh the backup/restore first')
          recovery_artifacts = read_github('actions/runs/' + backup_id + '/artifacts?per_page=100').get('artifacts', [])
          if not any(item.get('name') == 'hris-db-encrypted-' + backup_id
                     and item.get('expired') is False and item.get('size_in_bytes',0)>0
                     and str(item.get('digest','')).startswith('sha256:')
                     for item in recovery_artifacts):
              raise SystemExit('Exact encrypted backup artifact missing, expired, or lacks digest')
          # Same-SHA source recovery must exist. Offsite custody and matching
          # SHA-256 for both source and DB are a separately verified owner gate.
          source_runs = read_github('actions/runs?branch=main&per_page=100').get('workflow_runs', [])
          source = [x for x in source_runs if x.get('name')=='HRIS exact protected Main source history backup'
                    and x.get('head_sha')==protected_sha and x.get('status')=='completed'
                    and x.get('conclusion')=='success']
          if not source:
              raise SystemExit('Exact protected-Main source recovery proof missing')
          source_artifacts = read_github('actions/runs/' + str(source[0]['id']) + '/artifacts?per_page=100').get('artifacts',[])
          if not any(x.get('expired') is False and x.get('size_in_bytes',0)>0
                     and x.get('name')=='hris-exact-main-source-'+protected_sha
                     for x in source_artifacts):
              raise SystemExit('Exact source history backup artifact missing or expired')
          print('PASS: current SHA-matched DB export, isolated restore and source archive')

          profile_pr = read_github("pulls/159")
          if profile_pr.get("merged_at") is None or profile_pr.get("base", {}).get("ref") != "main":
              raise SystemExit("Employee Profile PR #159 must be merged into protected main first")
          reviewed_head = profile_pr.get("head", {}).get("sha")
          if not reviewed_head or len(reviewed_head) != 40:
              raise SystemExit("Cannot verify Employee Profile reviewed PR head")
          reviewed_checks = read_github("commits/" + reviewed_head + "/check-runs?per_page=100")
          for check_name in ("check", "isolated-hris"):
              if not any(check.get("name") == check_name
                         and check.get("status") == "completed"
                         and check.get("conclusion") == "success"
                         for check in reviewed_checks.get("check_runs", [])):
                  raise SystemExit("Reviewed Employee Profile PR head lacks PASS: " + check_name)

          workforce_pr = read_github("pulls/177")
          if workforce_pr.get("merged_at") is None or workforce_pr.get("base", {}).get("ref") != "main":
              raise SystemExit("Workforce account PR #177 must be merged first")
          workforce_head = workforce_pr.get("head", {}).get("sha")
          workforce_checks = read_github("commits/" + workforce_head + "/check-runs?per_page=100")
          for name in ("check", "isolated-hris"):
              if not any(c.get("name")==name and c.get("status")=="completed"
                         and c.get("conclusion")=="success" for c in workforce_checks.get("check_runs",[])):
                  raise SystemExit("Workforce PR #177 lacks exact-head PASS: " + name)

          protected_sha = os.environ["GITHUB_SHA"]
          protected_main_checks = read_github("commits/" + protected_sha + "/check-runs?per_page=100")
          if not any(check.get("name") == "check"
                     and check.get("status") == "completed"
                     and check.get("conclusion") == "success"
                     for check in protected_main_checks.get("check_runs", [])):
              raise SystemExit("Current protected main has not passed exact-SHA build verification")
          print("PASS: merged PR #159 exact-head acceptance and protected-main exact-SHA build")
          print("PASS: exact recovery and QA evidence validated; no deployment triggered yet")
          PY

          db_psql() {
            docker run --rm --env PGHOST --env PGPORT --env PGDATABASE \
              --env PGUSER --env PGSSLMODE --env PGPASSWORD \
              postgres:17-alpine psql -X -A -t -v ON_ERROR_STOP=1 "$@"
          }

          # The replacement project's installed versions are a DISTINCT lineage
          # from the original repository's migration files. Do not db-push the
          # full repository: it includes unrelated HR requisition migrations.
          scratch="$(mktemp -d "$RUNNER_TEMP/hris-profile-only.XXXXXXXX")"
          trap 'rm -rf "$scratch"' EXIT
          db_psql -F '|' -c "SELECT version,name FROM supabase_migrations.schema_migrations ORDER BY version" \
            > "$scratch/before.tsv"
          test "$(wc -l < "$scratch/before.tsv")" -eq 131
          test "$(tail -1 "$scratch/before.tsv" | cut -d '|' -f1)" = '20261027033218'
          ! grep -Eq '^(20261027040642|20261030114500|20261105093000|20261106090000)[|]' "$scratch/before.tsv" || {
            echo '::error::One or more scoped versions already installed; refresh source and state'; exit 1;
          }
          before_rows="$(db_psql -F ':' -c "SELECT (SELECT count(*) FROM auth.users), (SELECT count(*) FROM public.employees), (SELECT count(*) FROM public.tenants), (SELECT count(*) FROM public.admin_audit_logs);")"

          supabase init --workdir "$scratch" --force >/dev/null
          mkdir -p "$scratch/supabase/migrations"
          while IFS='|' read -r version name; do
            [[ "$version" =~ ^[0-9]{14}$ && "$name" =~ ^[a-z0-9_]+$ ]] || {
              echo '::error::Unexpected remote migration inventory'; exit 1;
            }
            # These are NEVER run: the matching versions are installed already.
            : > "$scratch/supabase/migrations/$version"_"$name".sql
          done < "$scratch/before.tsv"
          cp supabase/migrations/20261027040642_employee_profile_tenant_scoped_contract.sql \
             "$scratch/supabase/migrations/"
          cp supabase/migrations/20261030114500_employee_profile_certificate_policy_guards.sql \
             "$scratch/supabase/migrations/"
          cp supabase/migrations/20261105093000_hris_scoped_user_finalization.sql \
             "$scratch/supabase/migrations/"
          cp supabase/migrations/20261106090000_hris_new_workforce_account.sql \
             "$scratch/supabase/migrations/"
          test "$(find "$scratch/supabase/migrations" -type f -name '*.sql' | wc -l)" -eq 135
          test ! -e "$scratch/supabase/migrations/20261027090000_hris_requisition_pending_status_guard.sql"
          cmp -s supabase/migrations/20261027040642_employee_profile_tenant_scoped_contract.sql \
              "$scratch/supabase/migrations/20261027040642_employee_profile_tenant_scoped_contract.sql"
          cmp -s supabase/migrations/20261030114500_employee_profile_certificate_policy_guards.sql \
              "$scratch/supabase/migrations/20261030114500_employee_profile_certificate_policy_guards.sql"
          cmp -s supabase/migrations/20261105093000_hris_scoped_user_finalization.sql \
              "$scratch/supabase/migrations/20261105093000_hris_scoped_user_finalization.sql"
          cmp -s supabase/migrations/20261106090000_hris_new_workforce_account.sql \
              "$scratch/supabase/migrations/20261106090000_hris_new_workforce_account.sql"

          # Credentials remain in environment/process memory, not in source/artifacts/logs.
          db_url="$(python3 - <<'PY'
          import os,urllib.parse
          user=urllib.parse.quote(os.environ["PGUSER"],safe="")
          password=urllib.parse.quote(os.environ["PGPASSWORD"],safe="")
          host=os.environ["PGHOST"]
          print(f"postgresql://{user}:{password}@{host}:5432/postgres?sslmode=require")
          PY
          )"

          (cd "$scratch" && supabase db push --db-url "$db_url" --include-all --dry-run \
            > "$scratch/dry-run.txt" 2>&1) || {
            echo '::error::Remote migration dry-run failed; production unchanged'; exit 1;
          }
          # Fail closed unless the dry-run plans exactly the FOUR reviewed files.
          grep -Eo '[0-9]{14}_[a-z0-9_]+[.]sql' "$scratch/dry-run.txt" \
            | sort -u > "$scratch/planned.txt"
          printf '%s\n' \
            20261027040642_employee_profile_tenant_scoped_contract.sql \
            20261030114500_employee_profile_certificate_policy_guards.sql \
            20261105093000_hris_scoped_user_finalization.sql \
            20261106090000_hris_new_workforce_account.sql \
            > "$scratch/expected.txt"
          diff -u "$scratch/expected.txt" "$scratch/planned.txt" || {
            echo '::error::Unexpected migration plan: no SQL written'; exit 1;
          }
          # Guard against a concurrent independent DB change between the two gates.
          db_psql -F '|' -c "SELECT version,name FROM supabase_migrations.schema_migrations ORDER BY version" \
            > "$scratch/pre-apply.tsv"
          cmp -s "$scratch/before.tsv" "$scratch/pre-apply.tsv" || {
            echo '::error::Remote migration history changed before apply'; exit 1;
          }

          # Supabase CLI records EXACT source migration versions in hosted history.
          (cd "$scratch" && supabase --yes db push --db-url "$db_url" --include-all \
            > "$scratch/apply.txt" 2>&1) || {
            echo '::error::Four-migration SQL apply failed; inspect restricted logs and migration history before retrying'; exit 1;
          }

          db_psql -F '|' -c "SELECT version,name FROM supabase_migrations.schema_migrations ORDER BY version" \
            > "$scratch/after.tsv"
          test "$(wc -l < "$scratch/after.tsv")" -eq 135
          grep -Fxq '20261027040642|employee_profile_tenant_scoped_contract' "$scratch/after.tsv"
          grep -Fxq '20261030114500|employee_profile_certificate_policy_guards' "$scratch/after.tsv"
          grep -Fxq '20261105093000|hris_scoped_user_finalization' "$scratch/after.tsv"
          grep -Fxq '20261106090000|hris_new_workforce_account' "$scratch/after.tsv"
          grep -Ev '^(20261027040642|20261030114500|20261105093000|20261106090000)[|]' "$scratch/after.tsv" \
            > "$scratch/unchanged.tsv"
          cmp -s "$scratch/before.tsv" "$scratch/unchanged.tsv" || {
            echo '::error::Unrelated migration history changed'; exit 1;
          }

          after_rows="$(db_psql -F ':' -c "SELECT (SELECT count(*) FROM auth.users), (SELECT count(*) FROM public.employees), (SELECT count(*) FROM public.tenants), (SELECT count(*) FROM public.admin_audit_logs);")"
          test "$before_rows" = "$after_rows" || {
            echo '::error::Pre-existing user/employee/tenant/audit row count changed'; exit 1;
          }
          result="$(db_psql -c "
            SELECT CASE WHEN
              to_regprocedure('public.admin_finalize_new_workforce_user(uuid,uuid,uuid,text,text,text)') IS NOT NULL
              AND to_regprocedure('public.admin_finalize_system_user(uuid,uuid,text,uuid,text)') IS NOT NULL
              AND to_regprocedure('public.admin_get_my_provisioning_context()') IS NOT NULL
              AND NOT has_function_privilege('anon','public.admin_finalize_new_workforce_user(uuid,uuid,uuid,text,text,text)','EXECUTE')
              AND NOT has_function_privilege('authenticated','public.admin_finalize_new_workforce_user(uuid,uuid,uuid,text,text,text)','EXECUTE')
              AND to_regprocedure('public.employee_get_my_profile_v1(uuid)') IS NOT NULL
              AND to_regprocedure('public.employee_delete_my_profile_record_v1(uuid,text,uuid)') IS NOT NULL
              AND to_regclass('public.employee_bank_details') IS NOT NULL
              AND COALESCE((SELECT relrowsecurity FROM pg_class WHERE oid=to_regclass('public.employee_bank_details')),false)
              AND NOT has_table_privilege('anon','public.employee_bank_details','SELECT')
              AND NOT has_table_privilege('authenticated','public.employee_bank_details','SELECT')
              AND (SELECT count(*) FROM pg_policies WHERE schemaname='storage'
                   AND tablename='objects' AND permissive='RESTRICTIVE'
                   AND policyname IN ('employee_profile_certificate_select_namespace_guard',
                     'employee_profile_certificate_insert_namespace_guard',
                     'employee_profile_certificate_update_namespace_guard',
                     'employee_profile_certificate_delete_namespace_guard')) = 4
            THEN 'HRIS_FOUR_SQL_PASS' ELSE 'HRIS_FOUR_SQL_FAIL' END;")"
          test "$result" = 'HRIS_FOUR_SQL_PASS' || {
            echo '::error::Hosted SQL/RLS/Storage acceptance failed'; exit 1;
          }
          echo 'PASS: exactly four versioned migrations installed; users, tenants, employee counts, RLS, RPCs and Storage guards verified'
