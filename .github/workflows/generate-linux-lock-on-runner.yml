name: Generate and validate Linux Pages lock
on:
  push:
    branches:
      - work/main-pages-reproducibility-20261021
    paths:
      - .github/workflows/generate-linux-lock-on-runner.yml
permissions:
  contents: write
jobs:
  lock-and-prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/main-pages-reproducibility-20261021
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Verify exact candidate ref and toolchain
        run: |
          test "$(git branch --show-current)" = "work/main-pages-reproducibility-20261021"
          git status --short --branch
          git rev-parse HEAD
          test "$(node --version)" = "v22.23.3"
          test "$(npm --version)" = "10.9.9"
          node --version
          npm --version
      - name: Generate a complete Linux lockfile
        run: npm install --package-lock-only --include=optional --no-audit --no-fund
      - name: Verify the Linux Rolldown optional binding is locked
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const name = '@rolldown/binding-linux-x64-gnu';
          const binding = lock.packages['node_modules/' + name];
          const rolldown = lock.packages['node_modules/rolldown'];
          if (!binding) throw new Error(name + ' is missing from package-lock.json');
          if (!rolldown?.optionalDependencies?.[name]) throw new Error('Rolldown does not declare the Linux binding as optional');
          if (binding.version !== rolldown.optionalDependencies[name]) {
            throw new Error('Linux binding version does not match Rolldown optional dependency');
          }
          console.log(name + '@' + binding.version + ' is present and matches Rolldown.');
          NODE
      - name: Clean install and verify native binding
        run: |
          npm ci --no-audit --no-fund
          node -p "require.resolve('@rolldown/binding-linux-x64-gnu')"
      - name: TypeScript and approved-source contracts
        run: |
          npm run lint
          npm run test:contracts
      - name: First clean production build and output snapshot
        run: |
          npm run build
          find index.html .nojekyll assets -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/pages-first.sha256
      - name: Second clean locked install/build must be byte stable
        run: |
          rm -rf node_modules dist
          npm ci --no-audit --no-fund
          npm run build
          find index.html .nojekyll assets -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/pages-second.sha256
          diff -u /tmp/pages-first.sha256 /tmp/pages-second.sha256
          cat /tmp/pages-second.sha256
      - name: Write proof and stage only generated outputs
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          BINDING_VERSION="$(node -p "require('./package-lock.json').packages['node_modules/@rolldown/binding-linux-x64-gnu'].version")"
          {
            printf "Runner branch: work/main-pages-reproducibility-20261021\n"
            printf "Source SHA before generated-output commit: %s\n" "$SOURCE_SHA"
            printf "Node: %s\nnpm: %s\nLinux binding: %s\n" "$(node --version)" "$(npm --version)" "$BINDING_VERSION"
            printf "\nBuild output checksums (first and second clean builds matched):\n"
            cat /tmp/pages-second.sha256
          } > reproducibility-proof.txt
          git diff --check
          git add package-lock.json index.html assets
          git add -f .nojekyll
          git add reproducibility-proof.txt
          git diff --cached --stat
          git diff --cached --check
      - name: Commit and push only to the candidate branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: lock Linux dependencies and synchronize Pages build"
          git push origin HEAD:work/main-pages-reproducibility-20261021
      - name: Upload Linux lock/build reproducibility proof
        uses: actions/upload-artifact@v4
        with:
          name: linux-lock-build-proof
          path: reproducibility-proof.txt
          retention-days: 14
