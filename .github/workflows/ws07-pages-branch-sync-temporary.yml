name: WS07 temporary branch-only Pages parity synchronization
on:
  push:
    branches:
      - work/ws07-org-teams-paging-20261031
    paths-ignore:
      - 'assets/**'
      - 'index.html'
      - '.nojekyll'
permissions:
  contents: write
concurrency:
  group: ws07-org-teams-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  sync-pages-branch:
    if: github.repository == 'shihab-tech04/HRIS-v2' && github.ref == 'refs/heads/work/ws07-org-teams-paging-20261031'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Checkout the exact Candidate source required by repository contract tests
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main https://github.com/shihab-tech04/HRIS-Candidate-v2.git "$GITHUB_WORKSPACE/../HRIS-Candidate-v2"
          expected_sha='39d07585c854709f5c16b2712a6634da386c5c4d'
          git -C "$GITHUB_WORKSPACE/../HRIS-Candidate-v2" fetch --no-tags --depth=1 origin "$expected_sha"
          git -C "$GITHUB_WORKSPACE/../HRIS-Candidate-v2" checkout --detach "$expected_sha"
          actual_sha="$(git -C "$GITHUB_WORKSPACE/../HRIS-Candidate-v2" rev-parse HEAD)"
          test "$actual_sha" = "$expected_sha"
      - name: Match required exact-source checks
        run: |
          npm install --include=optional --no-audit --no-fund
          npm run lint
          npm run test:contracts
      - name: Build Pages twice and require deterministic identical assets
        env:
          VITE_ENABLE_PLATFORM_TENANTS: 'true'
        run: |
          set -euo pipefail
          npm run build
          first_digest="$(find index.html assets -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d ' ' -f1)"
          npm run build
          second_digest="$(find index.html assets -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d ' ' -f1)"
          test "$first_digest" = "$second_digest"
          cmp dist/index.html index.html
          diff -qr dist/assets assets
          git diff --check
      - name: Commit only generated Pages files on the isolated WS07 branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/work/ws07-org-teams-paging-20261031'
          git add -A -- index.html assets .nojekyll
          if git diff --cached --quiet; then
            echo 'Generated asset parity already satisfied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'WS07: synchronize deterministic Pages assets on feature branch'
          git push origin "HEAD:$GITHUB_REF"
